<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BIT 20주년 홈커밍, 모여봐요 뱌티의 숲">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>모여봐요 뱌티의 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-screen pannable island (1600×1200 world) — HUD pinned to the corners, entry flow and panels as wooden-framed paper signboards. Single daytime look by design. */
:root{
  --water:#7fd0e3; --water-dk:#58b6cf;
  --grass:#9fd171; --grass-dk:#7db357;
  --path:#ecdfbf; --path-dk:#d6c39b;
  --wood:#8b5a35; --wood-dk:#5f3a20;
  --paper:#fdf8ea; --paper-2:#f2e8cf; --paper-line:#dccb9f;
  --ink:#22453e; --ink-soft:#5d7a70;
  --leaf:#2e8a69; --mint:#c9f2dc; --pop:#f2785c; --sun:#f6c453;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --lift:0 3px 0 rgba(95,58,32,.22),0 10px 24px rgba(40,30,10,.18);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--water);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

#app{position:fixed;inset:0;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--water)}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1600px;height:1200px;transform-origin:0 0;will-change:transform;--inv:1}
#world.glide{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
#map{position:absolute;inset:0;width:1600px;height:1200px;display:block}
#chars,#signs{position:absolute;inset:0;pointer-events:none}
.hide-bots .char.bot{display:none}

/* ---------- world signs ---------- */
.sign{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);display:grid;grid-template-columns:auto 28px;align-items:center;column-gap:12px;padding:10px 12px 11px 18px;background:var(--paper);border:3px solid var(--paper-line);border-radius:14px;box-shadow:0 4px 0 #c5b083,0 12px 22px rgba(40,30,10,.25);text-align:left;transition:transform .15s}
.sign:hover{transform:translate(-50%,-100%) translateY(-3px)}
.sign .t{font-family:var(--font-display);font-size:23px;line-height:1;letter-spacing:.02em;color:var(--ink)}
.sign .s{grid-column:1;font-size:14px;color:var(--ink-soft);margin-top:5px}
.sign .chev{grid-column:2;grid-row:1/span 2;width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.gate-sign{position:absolute;transform:translate(-50%,-50%);padding:8px 26px 10px;border-radius:16px;background:var(--leaf);border:4px solid var(--wood);color:var(--paper);text-align:center;font-family:var(--font-display);line-height:1.05;box-shadow:0 5px 0 var(--wood-dk)}
.gate-sign small{display:block;font-size:15px;opacity:.9}
.gate-sign span{font-size:30px;color:var(--mint)}

/* ---------- characters ---------- */
.char{position:absolute;left:0;top:0;width:60px;height:80px;margin:-77px 0 0 -30px;pointer-events:auto;cursor:pointer}
.char .body{position:absolute;inset:0}
.char .body svg{width:100%;height:100%;display:block;overflow:visible}
.char.flip .body svg{transform:scaleX(-1)}
.char.flip .bit-txt{transform:scaleX(-1);transform-box:fill-box;transform-origin:center}
.char .ui{position:absolute;left:50%;bottom:calc(100% - 9px);transform:translateX(-50%) scale(var(--inv));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.char .tag{white-space:nowrap;font-size:13px;line-height:1.4;padding:1px 8px 2px;border-radius:999px;background:rgba(253,248,234,.95);color:var(--ink);box-shadow:0 1px 0 rgba(95,58,32,.3)}
.char .tag b{font-family:var(--font-display);font-weight:400;color:var(--leaf);margin-right:3px}
.char .bubble{position:relative;max-width:170px;width:max-content;padding:6px 11px;border-radius:13px;background:#fff;color:var(--ink);font-size:13px;line-height:1.35;box-shadow:0 2px 6px rgba(30,50,40,.2);word-break:keep-all;overflow-wrap:anywhere;animation:pop .25s ease-out}
.char .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.char.me .tag{background:var(--pop);color:#fff}
.char.me .tag b{color:#fff}
.char.me::before{content:"";position:absolute;left:50%;bottom:-3px;width:46px;height:14px;margin-left:-23px;border:3px solid var(--pop);border-radius:50%;opacity:.85;animation:ring 1.6s ease-in-out infinite}
.char.focus .body{animation:hop .45s ease-out 4}
.legL,.legR{transform-box:fill-box;transform-origin:50% 0}
.char.walking .legL{animation:step .42s ease-in-out infinite alternate}
.char.walking .legR{animation:step .42s ease-in-out infinite alternate-reverse}
.char.walking .bob{animation:bob .21s ease-in-out infinite alternate}
.char:not(.walking) .bob{animation:breathe 2.6s ease-in-out infinite}
@keyframes step{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
@keyframes bob{to{transform:translateY(-2.5px)}}
@keyframes breathe{50%{transform:translateY(-1px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes ring{50%{transform:scale(1.15);opacity:.45}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ping{position:absolute;width:30px;height:12px;margin:-6px 0 0 -15px;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ping .7s ease-out forwards}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.sparkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}

/* ---------- HUD ---------- */
.hud-top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud-top>*{pointer-events:auto}
.logo{position:relative;padding:8px 16px 9px;border-radius:16px;background:linear-gradient(180deg,#a26a40,#7d4f2e);border:3px solid var(--wood-dk);box-shadow:0 4px 0 var(--wood-dk),0 10px 20px rgba(40,30,10,.25);color:var(--paper);font-family:var(--font-display);line-height:1;text-align:center}
.logo small{display:block;font-size:13px;opacity:.9}
.logo strong{display:block;font-weight:400;font-size:27px;color:var(--mint);margin:2px 0 4px;text-shadow:0 2px 0 var(--wood-dk)}
.logo em{display:inline-block;font-style:normal;font-family:var(--font-body);font-size:10px;letter-spacing:.12em;padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--wood)}
.hud-right{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:none}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--paper);border:0;box-shadow:var(--lift);white-space:nowrap}
.pill svg{flex:none}
.pill b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--leaf);font-variant-numeric:tabular-nums}
.pill .long{display:inline}
.pill .short{display:none}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:var(--lift);display:grid;place-items:center;color:var(--ink)}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pop);color:#fff;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.menu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);z-index:45;width:250px;padding:8px;border-radius:18px;background:var(--paper);box-shadow:var(--lift);display:flex;flex-direction:column;gap:2px}
.menu button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;gap:8px}
.menu button:hover{background:var(--paper-2)}
.menu .note{font-size:12px;color:var(--ink-soft);padding:8px 12px 4px;line-height:1.5}
.menu .danger{color:#b4442c}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;gap:10px;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.hud-bottom>*{pointer-events:auto}
.talk{flex:1;min-width:0;max-width:520px;display:flex;flex-direction:column;gap:8px}
.emotes{display:flex;gap:6px;flex-wrap:wrap}
.emotes button{height:36px;padding:0 13px;border-radius:999px;border:0;background:var(--paper);box-shadow:var(--lift);font-size:14px}
.saybar{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--paper);box-shadow:var(--lift)}
.saybar input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;outline:none;font-size:15px}
.saybar button,.btn{border:0;border-radius:999px;height:40px;padding:0 18px;background:var(--leaf);color:#fff;font-family:var(--font-display);font-size:16px;white-space:nowrap}
.mapctl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.zoom{display:flex;flex-direction:column;gap:6px}
#mini{width:144px;height:108px;border-radius:16px;border:3px solid var(--paper);box-shadow:var(--lift);display:block;cursor:pointer;background:var(--water)}
.stage-qr{display:none}

/* ---------- toasts ---------- */
#toasts{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(92vw,460px)}
.toast{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--paper);box-shadow:var(--lift);animation:toastIn .35s ease-out;max-width:100%}
.toast .mini-av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--mint);overflow:hidden}
.toast .mini-av svg{width:100%;height:100%}
.toast b{font-family:var(--font-display);font-weight:400;color:var(--leaf)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

/* ---------- sheet / panel ---------- */
.scrim{position:absolute;inset:0;z-index:28;background:rgba(28,52,46,.28)}
.sheet{position:absolute;left:50%;bottom:0;z-index:30;width:min(100%,440px);transform:translateX(-50%);background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(30,40,20,.25);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));animation:up .3s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
.card-head{display:flex;gap:16px;align-items:center}
.card-av{width:96px;height:120px;flex:none;border-radius:20px;background:linear-gradient(180deg,var(--mint),#e9f7d9);display:grid;place-items:center}
.card-av svg{width:86px;height:114px}
.card-gen{font-family:var(--font-display);font-size:18px;color:var(--leaf)}
.card-name{font-family:var(--font-display);font-size:32px;line-height:1.1}
.tagchip{display:inline-block;margin-top:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.card-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn.pop{background:var(--pop)}
.field{display:flex;gap:6px;padding:5px;border-radius:999px;background:#fff;border:2px solid var(--paper-line)}
.field input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:0 12px;font-size:15px}
.hint{font-size:13px;color:var(--ink-soft);line-height:1.5}

.panel{position:absolute;top:0;right:0;bottom:0;z-index:40;width:min(100%,460px);background:var(--paper);box-shadow:-10px 0 30px rgba(30,40,20,.25);display:flex;flex-direction:column;animation:slide .3s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.panel-head{position:relative;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:2px dashed var(--paper-line)}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.02em}
.panel-head p{margin:4px 0 0;color:var(--ink-soft)}
.panel-head .close{top:calc(env(safe-area-inset-top,0px) + 16px)}
.panel-body{flex:1;overflow:auto;touch-action:pan-y;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 20px}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px dotted var(--paper-line);display:flex;flex-direction:column;gap:16px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid var(--paper)}
.tl li.now::before{background:var(--pop)}
.tl .yr{font-family:var(--font-display);font-size:26px;color:var(--leaf);font-variant-numeric:tabular-nums}
.tl h3{margin:2px 0 4px;font-size:17px}
.tl p{margin:0;line-height:1.6;color:var(--ink-soft)}
.ex{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);margin-left:6px;vertical-align:2px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.polaroid{background:#fff;padding:8px 8px 10px;border-radius:4px;box-shadow:0 3px 10px rgba(40,30,10,.18);transform:rotate(var(--r,0deg))}
.polaroid .ph{aspect-ratio:1;max-width:100%;border-radius:2px;display:grid;place-items:center;color:rgba(34,69,62,.55);font-size:13px;background:var(--bgc,#e8f1df);overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid figcaption{font-size:13px;text-align:center;margin-top:7px;color:var(--ink-soft)}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;padding:12px;border:2px dashed var(--paper-line);border-radius:14px;cursor:pointer;color:var(--ink-soft)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}

/* people */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--paper-line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.person{border:0;background:#fff;border-radius:16px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--paper-line)}
.person svg{width:60px;height:60px}
.person .g{font-family:var(--font-display);color:var(--leaf);font-size:14px}
.person .n{font-size:14px}
.person.me{outline:3px solid var(--pop)}
.search{margin-bottom:12px}

/* bridge */
.bridge-hero{border-radius:20px;padding:22px;background:linear-gradient(160deg,#3f8f87,#2e6f69);color:var(--paper)}
.bridge-hero h3{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:26px}
.bridge-hero p{margin:0;line-height:1.6;opacity:.92}
.feature-list{margin:16px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.feature-list li{padding:12px 14px;border-radius:14px;background:#fff;line-height:1.5}

/* inbox */
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--paper-line)}
.msg .mini-av{width:46px;height:46px;border-radius:50%;background:var(--mint);flex:none;overflow:hidden}
.msg .mini-av svg{width:100%;height:100%}
.msg .who{font-family:var(--font-display);color:var(--leaf)}
.msg p{margin:2px 0 6px;line-height:1.5}
.msg time{font-size:12px;color:var(--ink-soft)}
.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);line-height:1.6}

/* editor */
.ed-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.ed-tabs button{flex:1;border:0;border-radius:12px;padding:9px 10px;background:var(--paper-2);font-family:var(--font-display);font-size:16px;white-space:nowrap}
.ed-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.ed-group{margin-bottom:14px}
.ed-group h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--ink-soft);font-weight:400}
.ed-opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{width:58px;height:58px;padding:0;border-radius:14px;border:3px solid transparent;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--paper-line)}
.opt svg{width:52px;height:52px}
.opt[aria-pressed="true"]{border-color:var(--pop)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--paper-line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pop)}
.toggle{border:2px solid var(--paper-line);background:#fff;border-radius:999px;padding:7px 16px}
.toggle[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:#fff}

/* ---------- entry ---------- */
.entry{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,64,56,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));overflow:auto;touch-action:pan-y}
.entry-card{position:relative;width:min(100%,440px);background:var(--paper);border:4px solid var(--wood);border-radius:28px;box-shadow:0 6px 0 var(--wood-dk),0 24px 50px rgba(20,30,20,.35);padding:26px 22px 22px;animation:pop .35s ease-out}
.entry-card h1,.entry-card h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
.entry-logo{text-align:center;font-family:var(--font-display);line-height:1}
.entry-logo small{display:block;font-size:20px;color:var(--wood)}
.entry-logo strong{display:block;font-weight:400;font-size:56px;color:var(--leaf);margin:4px 0 8px;letter-spacing:.01em}
.entry-logo em{display:inline-block;font-style:normal;font-family:var(--font-body);font-size:12px;letter-spacing:.16em;padding:4px 12px;border-radius:999px;background:var(--wood);color:var(--paper)}
.lede{text-align:center;font-size:17px;line-height:1.6;margin:18px 0 20px}
.big{width:100%;height:54px;font-size:20px}
.linkish{display:block;margin:12px auto 0;border:0;background:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.step-label{font-size:12px;letter-spacing:.14em;color:var(--wood);margin-bottom:6px}
.entry-card h2{font-size:28px;margin-bottom:14px}
.gen-group{margin-bottom:10px}
.gen-group .lab{font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.gen-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gen-chips button{height:38px;border:2px solid var(--paper-line);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.gen-chips button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.gen-chips .wide{grid-column:span 2}
.ent-field{margin:16px 0 14px}
.ent-field label{display:block;font-size:12px;letter-spacing:.14em;color:var(--wood);margin-bottom:6px}
.ent-field input{width:100%;box-sizing:border-box;height:48px;border:2px solid var(--paper-line);border-radius:14px;padding:0 14px;font-size:17px;background:#fff;outline:none}
.ent-field input:focus{border-color:var(--leaf)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:42px;border:2px solid var(--paper-line);border-radius:12px;background:#fff}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nav{display:flex;gap:8px;margin-top:18px}
.nav .btn{height:50px;font-size:18px}
.nav .grow{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stagebox{position:relative;margin:4px auto 6px;width:180px;height:210px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#fff 0,var(--mint) 70%);display:grid;place-items:center}
.stagebox svg{width:150px;height:200px}
.stagebox .nametag{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--pop);color:#fff}
.make-status{text-align:center;font-family:var(--font-display);font-size:20px;margin:6px 0 12px;color:var(--leaf)}
.make-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.make-actions .btn{height:46px}
.editor-wrap{margin-top:14px;padding-top:14px;border-top:2px dashed var(--paper-line)}

/* ---------- stage (big screen) mode ---------- */
.stage .talk,.stage .zoom{display:none}
.stage #world{--stagebump:1.35}
.stage .char .ui{transform:translateX(-50%) scale(calc(var(--inv) * 1.35))}
.stage .pill{height:56px;font-size:19px;padding:0 22px}
.stage .pill b{font-size:26px}
.stage .stage-qr{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:20px;background:var(--paper);box-shadow:var(--lift);max-width:360px}
.stage-qr .qr{width:86px;height:86px;flex:none;border-radius:12px;border:3px dashed var(--paper-line);display:grid;place-items:center;font-size:12px;color:var(--ink-soft);text-align:center}
.stage-qr b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px}
.stage-qr span{font-size:13px;color:var(--ink-soft);line-height:1.5}
.stage .toast{font-size:20px;padding:10px 24px 10px 10px}
.stage .toast .mini-av{width:48px;height:48px}

@media (max-width:560px){
  .logo{padding:6px 11px 7px}
  .logo small{font-size:11px}
  .logo strong{font-size:21px}
  .logo em{display:none}
  .hud-right{gap:6px}
  .iconbtn{width:40px;height:40px}
  .pill{height:40px}
  .pill{padding:0 12px}
  .pill .long{display:none}
  .pill .short{display:inline}
  #mini{width:104px;height:78px;border-radius:12px}
  .entry-logo strong{font-size:46px}
  .sign .t{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<body>
<div id="app">
  <div id="viewport">

        <span class="long">현재 <b id="count">0</b>명의 뱌티가 모였어요</span>

      <button class="iconbtn" id="inboxBtn" type="button" aria-label="받은 메시지">

  <div class="menu" id="menu" hidden>

    <button type="button" data-act="stage"><span>전광판 모드</span><span id="stageState">꺼짐</span></button>
    <button type="button" data-act="bots"><span>예시 캐릭터 보이기</span><span id="botState">켜짐</span></button>
    <button type="button" data-act="reset" class="danger" id="resetBtn">내 캐릭터 지우고 처음부터</button>
    <div class="note">초안이에요. 지금 광장에 있는 캐릭터 대부분은 분위기를 보여주는 예시 캐릭터예요. 같은 브라우저에서 탭을 두 개 열면 서로의 캐릭터가 보여요.</div>
  </div>

  <div class="hud-bottom">
    <div class="stage-qr"><div class="qr">입장 QR<br>자리</div><div><b>QR 찍고 숲에 들어오세요</b><span>폰에서 내 캐릭터를 만들면 이 광장에 바로 나타나요</span></div></div>
    <div class="talk" id="talk" hidden>
      <div class="emotes" aria-label="빠른 인사">
        <button type="button" data-say="👋 안녕하세요!">👋 안녕</button>
        <button type="button" data-say="🎉 20주년 축하해요!">🎉 축하</button>
        <button type="button" data-say="지금도 BIT! ✨">✨ 지금도 BIT</button>
      </div>
      <form class="saybar" id="sayForm" autocomplete="off">
        <input id="sayInput" maxlength="40" placeholder="광장에 한마디 남기기" aria-label="광장에 한마디">
        <button type="submit">말하기</button>
      </form>
    </div>
    <div class="mapctl">
      <div class="zoom">
        <button class="iconbtn" id="zoomIn" type="button" aria-label="확대"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="iconbtn" id="zoomOut" type="button" aria-label="축소"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      </div>
      <canvas id="mini" aria-label="미니맵, 눌러서 이동"></canvas>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="캐릭터 정보"></section>
  <aside class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2 id="panelTitle"></h2><p id="panelSub"></p>
      <button class="close" type="button" id="panelClose" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
  <div class="entry" id="entry"><div class="entry-card" id="entryCard"></div></div>
</div>

<script>
(() => {
'use strict';
/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const CLOSE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const CONFIG = { bridgeUrl: '' };  // BIT Bridge 주소를 받으면 여기에 넣어요
function shade(hex, p){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255; const t=p<0?0:255, f=Math.abs(p)/100; r=Math.round((t-r)*f+r); g=Math.round((t-g)*f+g); b=Math.round((t-b)*f+b); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function isLight(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255)) > 170; }
const genLabel = g => g === 'G' ? '게스트' : g + '기';

/* ================= avatar parts ================= */
const AV = {
  skin:['#ffe3cc','#f7cfab','#e6b088','#c68a5f','#93603f'],
  hairColor:['#2a211f','#4f3424','#7f5233','#b98a52','#e6cf98','#8c3f33','#475a80','#d985a8'],
  hairM:['short','side','buzz','curly','mop'],
  hairF:['bob','long','pony','bun','mop'],
  hairAll:['short','side','buzz','curly','mop','bob','long','pony','bun'],
  eyes:['dot','round','smile','sleepy','wink'],
  mouth:['smile','open','cat','small','grin'],
  top:['tee','hoodie','shirt','stripe','bit','sweater'],
  topColor:['#5b9fd6','#ef8a6b','#76bf86','#f3c653','#ad88d6','#fbfbf7','#3c4a5e','#de5b6c'],
  bottom:['pants','shorts','skirt'],
  bottomColor:['#3a4a6c','#2d2d34','#8a6b4e','#cfc6b2','#5a7f9e','#a24f5c'],
  shoe:['#4a3a32','#f4f1ea','#2d2d34','#c0573f'],
  acc:['none','glasses','round','cap','beanie','flower','headphones','ribbon'],
  accColor:['#e05a6b','#5b9fd6','#f3c653','#3c4a5e','#76bf86','#ad88d6']
};
const LABEL = {short:'짧은 머리',side:'옆가르마',buzz:'까까머리',curly:'곱슬',mop:'덥수룩 앞머리',bob:'단발',long:'긴 머리',pony:'포니테일',bun:'똥머리',
  dot:'콩눈',round:'반짝눈',smile:'웃는 눈',sleepy:'졸린 눈',wink:'윙크',open:'활짝',cat:'고양이 입',small:'오',grin:'이 보이게',
  tee:'반팔',hoodie:'후드',shirt:'셔츠',stripe:'줄무늬',bit:'BIT 티',sweater:'니트',pants:'긴 바지',shorts:'반바지',skirt:'치마',
  none:'없음',glasses:'안경',cap:'모자',beanie:'비니',flower:'꽃핀',headphones:'헤드폰',ribbon:'리본'};
LABEL.smileM = '미소';

function randomAvatar(g, rnd = Math.random){
  const p = arr => arr[Math.floor(rnd()*arr.length)];
  const gender = (g === 'm' || g === 'f') ? g : (rnd() < .5 ? 'm' : 'f');
  return {
    g: gender,
    skin: p(AV.skin), hairColor: rnd() < .55 ? p(AV.hairColor.slice(0,3)) : p(AV.hairColor),
    hair: p(gender === 'm' ? AV.hairM : AV.hairF),
    eyes: p(AV.eyes), mouth: p(AV.mouth), blush: rnd() < .55,
    top: p(AV.top), topColor: p(AV.topColor),
    bottom: gender === 'm' ? (rnd() < .75 ? 'pants' : 'shorts') : p(['pants','skirt','skirt','shorts']),
    bottomColor: p(AV.bottomColor), shoe: p(AV.shoe),
    acc: rnd() < .42 ? 'none' : p(AV.acc.slice(1)), accColor: p(AV.accColor)
  };
}

function hairParts(style, c){
  const d = shade(c, -20);
  switch(style){
    case 'short': return ['', `<path d="M26 58 Q22 22 60 21 Q98 22 94 58 Q91 44 84 40 Q72 46 56 41 Q42 44 34 42 Q28 48 26 58Z" fill="${c}"/>`];
    case 'side': return ['', `<path d="M26 60 Q22 20 64 20 Q98 23 94 56 Q92 44 86 38 Q70 48 44 40 Q34 46 26 60Z" fill="${c}"/><path d="M46 39 Q62 31 85 38" stroke="${d}" stroke-width="2" fill="none" stroke-linecap="round"/>`];
    case 'buzz': return ['', `<path d="M28 52 Q30 24 60 23 Q90 24 92 52 Q86 38 60 36 Q34 38 28 52Z" fill="${c}"/>`];
    case 'curly': { let s = ''; for (let i = 0; i <= 8; i++){ const a = Math.PI + i*Math.PI/8; s += `<circle cx="${(60+33*Math.cos(a)).toFixed(1)}" cy="${(50+27*Math.sin(a)).toFixed(1)}" r="11" fill="${c}"/>`; } return ['', `<ellipse cx="60" cy="33" rx="30" ry="14" fill="${c}"/>${s}`]; }
    case 'mop': return ['', `<path d="M25 62 Q20 17 60 17 Q100 17 95 62 Q92 52 88 49 Q84 56 78 49 Q72 56 66 49 Q60 57 54 49 Q48 56 42 49 Q36 56 32 49 Q28 53 25 62Z" fill="${c}"/>`];
    case 'bob': return [`<path d="M22 60 Q20 18 60 18 Q100 18 98 60 L98 86 Q98 93 90 93 L30 93 Q22 93 22 86Z" fill="${c}"/>`,
                        `<path d="M26 58 Q24 20 60 20 Q96 20 94 58 Q92 46 86 44 L34 44 Q28 46 26 58Z" fill="${c}"/>`];
    case 'long': return [`<path d="M22 60 Q20 18 60 18 Q100 18 98 60 L101 116 Q91 123 80 117 L40 117 Q29 123 19 116Z" fill="${c}"/>`,
                         `<path d="M26 64 Q24 20 60 20 Q96 20 94 64 Q90 40 62 33 L60 40 L58 33 Q30 40 26 64Z" fill="${c}"/>`];
    case 'pony': return [`<path d="M84 36 Q114 46 106 88 Q102 104 92 110 Q99 86 88 60Z" fill="${c}"/>`,
                         `<path d="M26 58 Q22 20 60 20 Q98 20 94 58 Q90 42 78 40 Q60 48 40 40 Q30 46 26 58Z" fill="${c}"/><circle cx="90" cy="38" r="4" fill="${d}"/>`];
    case 'bun': return [`<circle cx="60" cy="19" r="13" fill="${c}"/>`,
                        `<path d="M26 58 Q24 22 60 22 Q96 22 94 58 Q88 40 70 40 Q52 46 36 42 Q28 48 26 58Z" fill="${c}"/>`];
  }
  return ['', ''];
}
function eyesSVG(t){
  const E = x => `<ellipse cx="${x}" cy="62" rx="3.4" ry="4.4" fill="#2b2220"/><circle cx="${x+1.2}" cy="60.4" r="1.2" fill="#fff"/>`;
  const R = x => `<ellipse cx="${x}" cy="62" rx="5" ry="6" fill="#2b2220"/><circle cx="${x+1.6}" cy="59.8" r="1.9" fill="#fff"/><circle cx="${x-1.6}" cy="64.4" r=".9" fill="#fff"/>`;
  const Hh = x => `<path d="M${x-4.5} 63.5 Q${x} 57.5 ${x+4.5} 63.5" stroke="#2b2220" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const S = x => `<path d="M${x-4.5} 61.5 Q${x} 65 ${x+4.5} 61.5" stroke="#2b2220" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  switch(t){ case 'round': return R(47)+R(73); case 'smile': return Hh(47)+Hh(73); case 'sleepy': return S(47)+S(73); case 'wink': return E(47)+Hh(73); default: return E(47)+E(73); }
}
function mouthSVG(t){
  const st = 'stroke="#7a3b2e" stroke-width="2.2" fill="none" stroke-linecap="round"';
  switch(t){
    case 'open': return `<path d="M54 72 Q60 72 66 72 Q65 80 60 80 Q55 80 54 72Z" fill="#a8434c"/><path d="M56.5 77.6 Q60 75.6 63.5 77.6 Q62 80 60 80 Q58 80 56.5 77.6Z" fill="#ef8a8f"/>`;
    case 'cat': return `<path d="M53 73 Q56.5 76.5 60 73 Q63.5 76.5 67 73" ${st}/>`;
    case 'small': return `<ellipse cx="60" cy="74.5" rx="2.6" ry="2.1" fill="#a8434c"/>`;
    case 'grin': return `<path d="M53 72 L67 72 Q66 79 60 79 Q54 79 53 72Z" fill="#fff" stroke="#7a3b2e" stroke-width="1.6" stroke-linejoin="round"/>`;
    default: return `<path d="M55 73 Q60 78 65 73" ${st}/>`;
  }
}
function legsSVG(a){
  const s = a.skin, b = a.bottomColor, sh = a.shoe;
  let L, R;
  if (a.bottom === 'pants'){ L = `<rect x="45" y="116" width="13" height="29" rx="5" fill="${b}"/>`; R = `<rect x="62" y="116" width="13" height="29" rx="5" fill="${b}"/>`; }
  else if (a.bottom === 'shorts'){ L = `<rect x="46.5" y="120" width="10" height="25" rx="5" fill="${s}"/><rect x="44.5" y="116" width="14" height="14" rx="4" fill="${b}"/>`; R = `<rect x="63.5" y="120" width="10" height="25" rx="5" fill="${s}"/><rect x="61.5" y="116" width="14" height="14" rx="4" fill="${b}"/>`; }
  else { L = `<rect x="46.5" y="118" width="10" height="27" rx="5" fill="${s}"/>`; R = `<rect x="63.5" y="118" width="10" height="27" rx="5" fill="${s}"/>`; }
  L += `<ellipse cx="51.5" cy="146" rx="8" ry="4.6" fill="${sh}"/>`;
  R += `<ellipse cx="68.5" cy="146" rx="8" ry="4.6" fill="${sh}"/>`;
  return `<g class="legL">${L}</g><g class="legR">${R}</g>`;
}
function bodySVG(a){
  const s = a.skin, c = a.topColor, d = shade(c, -18), l = shade(c, 35);
  const long = a.top === 'hoodie' || a.top === 'shirt' || a.top === 'sweater';
  const arm = side => {
    const x = side < 0 ? 31 : 78, rot = side < 0 ? 10 : -10, cx = side < 0 ? 36.5 : 83.5;
    const sleeve = long
      ? `<rect x="${x}" y="88" width="11" height="27" rx="5.5" fill="${c}"/>${a.top==='sweater'?`<rect x="${x}" y="110" width="11" height="5" rx="2" fill="${d}"/>`:''}`
      : `<rect x="${x}" y="89" width="11" height="26" rx="5.5" fill="${s}"/><rect x="${x-.5}" y="87" width="12" height="13" rx="5" fill="${c}"/>`;
    return `<g transform="rotate(${rot} ${cx} 90)">${sleeve}<circle cx="${cx}" cy="116" r="5" fill="${s}"/></g>`;
  };
  let out = arm(-1) + arm(1);
  out += `<path d="M43 90 Q43 85 50 85 L70 85 Q77 85 77 90 L79 121 Q79 123 77 123 L43 123 Q41 123 41 121Z" fill="${c}"/>`;
  const neck = `<path d="M53 85 Q60 91 67 85Z" fill="${s}"/>`;
  switch(a.top){
    case 'tee': out += neck; break;
    case 'stripe': out += `<rect x="43" y="95" width="34" height="3.6" fill="#fff" opacity=".75"/><rect x="42.5" y="103" width="35" height="3.6" fill="#fff" opacity=".75"/><rect x="42" y="111" width="36" height="3.6" fill="#fff" opacity=".75"/>` + neck; break;
    case 'bit': out += neck + `<text class="bit-txt" x="60" y="110" text-anchor="middle" font-family="Jua,sans-serif" font-size="11" fill="${isLight(c)?'#22453e':'#fff'}">BIT</text>`; break;
    case 'hoodie': out += `<path d="M46 87 Q60 99 74 87" stroke="${d}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M56 92 L55 102 M64 92 L65 102" stroke="${l}" stroke-width="1.6" stroke-linecap="round"/><rect x="48" y="108" width="24" height="10" rx="4" fill="${d}"/>`; break;
    case 'shirt': out += `<path d="M51 85 L60 93 L54 98 L47.5 88Z M69 85 L60 93 L66 98 L72.5 88Z" fill="${isLight(c)?'#e9e4d6':'#fbfbf7'}"/><circle cx="60" cy="101" r="1.3" fill="${d}"/><circle cx="60" cy="109" r="1.3" fill="${d}"/><circle cx="60" cy="117" r="1.3" fill="${d}"/>`; break;
    case 'sweater': out += neck + `<rect x="41" y="118" width="38" height="5" rx="2" fill="${d}"/><path d="M45 102 l5 -5 l5 5 l5 -5 l5 5 l5 -5 l5 5" stroke="${l}" stroke-width="2" fill="none" stroke-linejoin="round"/>`; break;
  }
  return out;
}
function accSVG(a){
  const c = a.accColor;
  switch(a.acc){
    case 'glasses': return `<g stroke="#2b2b2b" stroke-width="2" fill="rgba(255,255,255,.22)"><rect x="39" y="55.5" width="16" height="13" rx="3.5"/><rect x="65" y="55.5" width="16" height="13" rx="3.5"/></g><path d="M55 61 L65 61" stroke="#2b2b2b" stroke-width="2"/>`;
    case 'round': return `<g stroke="#8a5a2b" stroke-width="2" fill="rgba(255,255,255,.22)"><circle cx="47" cy="62" r="8"/><circle cx="73" cy="62" r="8"/></g><path d="M55 61 Q60 58 65 61" stroke="#8a5a2b" stroke-width="2" fill="none"/>`;

function centerOn(x, y, s = cam.s, glide = false){
  const { w, h } = vpSize();
  if (glide){ worldEl.classList.add('glide'); clearTimeout(centerOn.t); centerOn.t = setTimeout(() => worldEl.classList.remove('glide'), 750); }
  cam.s = s; cam.x = w/2 - x*s; cam.y = h/2 - y*s; applyCam();
}
function zoomAt(sx, sy, factor){
  const r = vp.getBoundingClientRect();
  const wx = (sx - r.left - cam.x) / cam.s, wy = (sy - r.top - cam.y) / cam.s;
  cam.s = clamp(cam.s * factor, minScale(), 2.2);
  cam.x = sx - r.left - wx * cam.s; cam.y = sy - r.top - wy * cam.s; applyCam();
}
function toWorld(sx, sy){ const r = vp.getBoundingClientRect(); return { x: (sx - r.left - cam.x) / cam.s, y: (sy - r.top - cam.y) / cam.s }; }
function defaultView(glide){
  const { w, h } = vpSize();
  if (app.classList.contains('stage') || (w > 900 && h > 560)) centerOn(W/2, H/2 - 10, minScale() * (app.classList.contains('stage') ? 1 : 1.04), glide);

}

const app = $('#app'), charsLayer = $('#chars');
const chars = new Map();
let meId = store.get('bitforest.me', null);
let showBots = true;

function plazaPoint(){
  for (let i = 0; i < 20; i++){ const a = Math.random()*Math.PI*2, d = Math.sqrt(Math.random())*(PLAZA.r - 28); const p = { x: PLAZA.x + Math.cos(a)*d, y: PLAZA.y + Math.sin(a)*d }; if (Math.hypot(p.x - FOUNTAIN.x, p.y - FOUNTAIN.y) > FOUNTAIN.r + 26) return p; }
  return { x: PLAZA.x + 150, y: PLAZA.y };
}
function randomTarget(){
  if (Math.random() < .62) return plazaPoint();
  const sg = SEGMENTS[Math.floor(Math.random()*SEGMENTS.length)];
  const t = .3 + Math.random()*.6, dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx, dy), j = (Math.random()-.5)*56;
  return { x: sg.a.x + dx*t - dy/L*j, y: sg.a.y + dy*t + dx/L*j };
}
function route(a, b){
  const c = FOUNTAIN, R = c.r + 18, abx = b.x-a.x, aby = b.y-a.y, L2 = abx*abx + aby*aby || 1;
  const t = ((c.x-a.x)*abx + (c.y-a.y)*aby) / L2;
  if (t <= 0 || t >= 1) return [b];
  const px = a.x + abx*t, py = a.y + aby*t, d = Math.hypot(px-c.x, py-c.y);
  if (d >= R) return [b];
  let nx = px - c.x, ny = py - c.y; if (d < 1){ nx = -aby; ny = abx; }
  const n = Math.hypot(nx, ny);
  return [{ x: c.x + nx/n*(R+34), y: c.y + ny/n*(R+34) }, b];
}
function walkTo(o, p){ o.queue = route(o, p); }

function addChar(c, { arrive = false } = {}){
  if (chars.has(c.id)) return chars.get(c.id);
  const o = Object.assign({}, c, { queue: [], wait: Math.random()*3, speed: c.bot ? 30 + Math.random()*24 : 58, walking: false, flip: false, z: -1, holdUntil: 0 });
  if (arrive){ o.x = 800 + (Math.random()-.5)*30; o.y = 1190; o.queue = [{ x: 800 + (Math.random()-.5)*40, y: 1040 }, ...route({ x: 800, y: 1040 }, plazaPoint())]; }
  else { const p = randomTarget(); o.x = p.x; o.y = p.y; }
  const el = document.createElement('div');
  el.className = 'char' + (c.bot ? ' bot' : '') + (c.id === meId ? ' me' : '');
  el.dataset.id = c.id;
  el.innerHTML = `<div class="ui"><div class="bubble" hidden></div><div class="tag"><b>${esc(genLabel(c.gen))}</b>${esc(c.name)}</div></div><div class="body">${avatarSVG(c.av)}</div>`;
  o.el = el; charsLayer.appendChild(el); chars.set(c.id, o); place(o); updateCount();
  return o;
}
function refreshChar(o){ o.el.querySelector('.body').innerHTML = avatarSVG(o.av); o.el.querySelector('.tag').innerHTML = `<b>${esc(genLabel(o.gen))}</b>${esc(o.name)}`; }
function removeChar(id){ const o = chars.get(id); if (!o) return; o.el.remove(); chars.delete(id); updateCount(); }
function place(o){ o.el.style.transform = `translate3d(${o.x.toFixed(1)}px,${o.y.toFixed(1)}px,0)`; const z = Math.round(o.y); if (z !== o.z){ o.z = z; o.el.style.zIndex = z; } }
function say(id, text){
  const o = chars.get(id); if (!o) return;
  const b = o.el.querySelector('.bubble'); b.textContent = text; b.hidden = false;
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  clearTimeout(o.bt); o.bt = setTimeout(() => { b.hidden = true; }, 5200);
}
function visibleChars(){ return [...chars.values()].filter(o => showBots || !o.bot); }
function updateCount(){ const n = visibleChars().length; $('#count').textContent = n; $('#countS').textContent = n; const ec = $('#entryCount'); if (ec) ec.textContent = n; }

let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const o of chars.values()){
    if (!o.queue.length){
      if (o.walking){ o.walking = false; o.el.classList.remove('walking'); }
      o.wait -= dt;
      if (o.wait <= 0 && now > o.holdUntil){ walkTo(o, randomTarget()); o.wait = 1.5 + Math.random()*5; }
      continue;
    }
    const t = o.queue[0], dx = t.x - o.x, dy = t.y - o.y, d = Math.hypot(dx, dy), step = o.speed * dt;
    if (d <= step){ o.x = t.x; o.y = t.y; o.queue.shift(); } else { o.x += dx/d*step; o.y += dy/d*step; }
    if (!o.walking){ o.walking = true; o.el.classList.add('walking'); }
    if (Math.abs(dx) > 2){ const fl = dx < 0; if (fl !== o.flip){ o.flip = fl; o.el.classList.toggle('flip', fl); } }
    place(o);
  }
  requestAnimationFrame(tick);
}

/* ================= avatar editor ================= */
function mountEditor(root, av, onChange){
  let tab = 'face';
  const GROUPS = {
    face: [ { k:'skin', label:'피부', type:'color', vals:AV.skin }, { k:'eyes', label:'눈', type:'part', vals:AV.eyes, head:true }, { k:'mouth', label:'입', type:'part', vals:AV.mouth, head:true }, { k:'blush', label:'볼터치', type:'toggle' } ],
    hair: [ { k:'hair', label:'헤어스타일', type:'part', vals:AV.hairAll, head:true }, { k:'hairColor', label:'머리색', type:'color', vals:AV.hairColor } ],
    wear: [ { k:'top', label:'상의', type:'part', vals:AV.top }, { k:'topColor', label:'상의 색', type:'color', vals:AV.topColor }, { k:'bottom', label:'하의', type:'part', vals:AV.bottom }, { k:'bottomColor', label:'하의 색', type:'color', vals:AV.bottomColor }, { k:'shoe', label:'신발', type:'color', vals:AV.shoe } ],
    acc: [ { k:'acc', label:'소품', type:'part', vals:AV.acc, head:true }, { k:'accColor', label:'소품 색', type:'color', vals:AV.accColor } ]
  };
  const TABS = [['face','얼굴'],['hair','헤어'],['wear','옷'],['acc','소품']];
  function render(){
    let h = `<div class="ed-tabs" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>`;
    GROUPS[tab].forEach(g => {
      h += `<div class="ed-group"><h4>${g.label}</h4><div class="ed-opts">`;
      if (g.type === 'color') h += g.vals.map(v => `<button type="button" class="sw" data-k="${g.k}" data-v="${v}" style="background:${v}" aria-label="${g.label} ${v}" aria-pressed="${av[g.k] === v}"></button>`).join('');
      else if (g.type === 'toggle') h += `<button type="button" class="toggle" data-k="${g.k}" aria-pressed="${!!av[g.k]}">${av[g.k] ? '켜짐' : '꺼짐'}</button>`;
      else h += g.vals.map(v => { const a = Object.assign({}, av, { [g.k]: v }); return `<button type="button" class="opt" data-k="${g.k}" data-v="${v}" title="${LABEL[v] || v}" aria-label="${LABEL[v] || v}" aria-pressed="${av[g.k] === v}">${avatarSVG(a, { viewBox: g.head ? HEAD_VB : '8 2 104 156', noShadow: true })}</button>`; }).join('');
      h += `</div></div>`;
    });
    root.innerHTML = h;
  }
  root.onclick = e => {
    const t = e.target.closest('[data-tab]'); if (t){ tab = t.dataset.tab; render(); return; }
    const o = e.target.closest('[data-k]'); if (!o) return;
    const k = o.dataset.k; av[k] = k === 'blush' ? !av.blush : o.dataset.v;
    onChange && onChange(av); render();
  };
  render();
  return { render };
}

/* ================= input ================= */
const ptrs = new Map(); let drag = null, pinch = null;
vp.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false, target: e.target };
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, s: cam.s, w: toWorld((a.x+b.x)/2, (a.y+b.y)/2) }; if (drag) drag.moved = true; }
  try { vp.setPointerCapture(e.pointerId); } catch(_){}
});
vp.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], r = vp.getBoundingClientRect();
    cam.s = clamp(pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d, minScale(), 2.2);
    cam.x = (a.x+b.x)/2 - r.left - pinch.w.x*cam.s; cam.y = (a.y+b.y)/2 - r.top - pinch.w.y*cam.s; applyCam(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 7){ drag.moved = true; vp.classList.add('dragging'); }
  if (drag.moved){ cam.x = drag.cx + dx; cam.y = drag.cy + dy; applyCam(); }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1){ const [p] = [...ptrs.values()]; drag = { sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: true, target: null }; return; }
  if (ptrs.size === 0 && drag){ if (!drag.moved && e.type === 'pointerup') handleTap(drag.target, e.clientX, e.clientY); drag = null; vp.classList.remove('dragging'); }
}
vp.addEventListener('pointerup', endPtr); vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, { passive: false });
function handleTap(target, sx, sy){
  if (!target) return;
  const ch = target.closest && target.closest('.char'); if (ch){ openCard(ch.dataset.id); return; }
  const b = target.closest && target.closest('[data-b]'); if (b){ openBuilding(b.dataset.b); return; }

  if (me && !app.classList.contains('stage')){
    const p = toWorld(sx, sy);
    if (!inIsland(p.x, p.y, .92)) return;
    walkTo(me, p); me.wait = 0; me.holdUntil = performance.now() + 25000;
    Net.post('move', { id: meId, x: p.x, y: p.y });
    const pg = document.createElement('div'); pg.className = 'ping'; pg.style.left = p.x + 'px'; pg.style.top = p.y + 'px'; $('#signs').appendChild(pg); setTimeout(() => pg.remove(), 750);
  }
}

/* ================= minimap ================= */
const mini = $('#mini'); let islandPath2D = null;
function drawMini(){
  const w = mini.clientWidth, h = mini.clientHeight; if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  if (mini.width !== Math.round(w*dpr)){ mini.width = Math.round(w*dpr); mini.height = Math.round(h*dpr); }
  const ctx = mini.getContext('2d');
  ctx.setTransform(dpr*w/W, 0, 0, dpr*h/H, 0, 0);
  ctx.fillStyle = '#7fd0e3'; ctx.fillRect(0, 0, W, H);
  if (!islandPath2D && islandD) { try { islandPath2D = new Path2D(islandD); } catch(e){} }
  ctx.fillStyle = '#9fd171'; if (islandPath2D) ctx.fill(islandPath2D);
  ctx.strokeStyle = '#ecdfbf'; ctx.lineWidth = 80; ctx.lineCap = 'round';
  SEGMENTS.forEach(s => { ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke(); });
  ctx.fillStyle = '#ecdfbf'; ctx.beginPath(); ctx.arc(PLAZA.x, PLAZA.y, PLAZA.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#7fd0e3'; ctx.beginPath(); ctx.arc(FOUNTAIN.x, FOUNTAIN.y, 60, 0, 7); ctx.fill();
  BUILDINGS.forEach(b => { ctx.fillStyle = b.roof; ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h); });
  for (const o of chars.values()){ if (o.bot && !showBots) continue; ctx.fillStyle = o.id === meId ? '#f2785c' : '#22453e'; ctx.beginPath(); ctx.arc(o.x, o.y, o.id === meId ? 26 : 13, 0, 7); ctx.fill(); }
  const { w: vw, h: vh } = vpSize();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14; ctx.strokeRect(-cam.x/cam.s, -cam.y/cam.s, vw/cam.s, vh/cam.s);
}
mini.addEventListener('click', e => { const r = mini.getBoundingClientRect(); centerOn((e.clientX - r.left)/r.width*W, (e.clientY - r.top)/r.height*H, cam.s, true); });
setInterval(drawMini, 300);
