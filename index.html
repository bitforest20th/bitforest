<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BIT 20주년 홈커밍, 모여봐요 뱌티의 숲">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>모여봐요 뱌티의 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-screen pannable island (2400×1800 world) — HUD pinned to the corners, entry flow and panels as wooden-framed paper signboards. Single daytime look by design. */
:root{
  --water:#7fd0e3; --water-dk:#58b6cf;
  --grass:#9fd171; --grass-dk:#7db357;
  --path:#ecdfbf; --path-dk:#d6c39b;
  --wood:#8b5a35; --wood-dk:#5f3a20;
  --paper:#fdf8ea; --paper-2:#f2e8cf; --paper-line:#dccb9f;
  --ink:#22453e; --ink-soft:#5d7a70;
  --leaf:#2e8a69; --mint:#c9f2dc; --pop:#f2785c; --sun:#f6c453;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --lift:0 3px 0 rgba(95,58,32,.22),0 10px 24px rgba(40,30,10,.18);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--water);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

#app{position:fixed;inset:0;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--water)}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:2400px;height:1800px;transform-origin:0 0;will-change:transform;--inv:1}
#world.glide{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
#map{position:absolute;inset:0;width:2400px;height:1800px;display:block}
.statue{position:absolute;width:388px;height:291px;margin:-226px 0 0 -194px;pointer-events:none}
.statue img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(120,90,10,.28))}
.statue .tw{position:absolute;width:18px;height:18px;background:#fffbe6;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:tw 2.4s ease-in-out infinite;opacity:0}
.ff{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff6c2;box-shadow:0 0 8px 3px rgba(255,214,110,.7);pointer-events:none;opacity:0;animation:ff 6s ease-in-out infinite}
@keyframes ff{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}55%{transform:translate(16px,-20px)}80%{opacity:.7}100%{opacity:0;transform:translate(-6px,-38px)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
#chars,#signs{position:absolute;inset:0;pointer-events:none}
.hide-bots .char.bot{display:none}

/* ---------- world signs ---------- */
.sign{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);display:grid;grid-template-columns:auto 42px;align-items:center;column-gap:16px;padding:14px 16px 16px 26px;background:var(--paper);border:4px solid var(--paper-line);border-radius:20px;box-shadow:0 6px 0 #c5b083,0 16px 28px rgba(40,30,10,.28);white-space:nowrap;text-align:left;transition:transform .15s}
.sign:hover{transform:translate(-50%,-100%) translateY(-3px)}
.sign .t{font-family:var(--font-display);font-size:36px;line-height:1;letter-spacing:.02em;color:var(--ink)}
.sign .s{grid-column:1;font-size:20px;color:var(--ink-soft);margin-top:7px}
.sign .chev{grid-column:2;grid-row:1/span 2;width:42px;height:42px;border-radius:13px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.gate-sign{position:absolute;transform:translate(-50%,-50%);padding:8px 26px 10px;border-radius:16px;background:var(--leaf);border:4px solid var(--wood);color:var(--paper);text-align:center;font-family:var(--font-display);line-height:1.05;box-shadow:0 5px 0 var(--wood-dk)}
.gate-sign small{display:block;font-size:15px;opacity:.9}
.gate-sign span{font-size:30px;color:var(--mint)}

/* ---------- characters ---------- */
.char{position:absolute;left:0;top:0;width:64px;height:80px;margin:-76px 0 0 -32px;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .4s}
.char.ready{opacity:1}
.char .body{position:absolute;inset:0}
.char .body canvas{position:relative;width:100%;height:100%;display:block}
.char .body::before{content:"";position:absolute;left:50%;bottom:0;width:38px;height:10px;margin-left:-19px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,50,25,.38),rgba(30,50,25,0))}
.av3{display:block}
.char .ui{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%) scale(var(--inv));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.char .tag{white-space:nowrap;font-size:11px;line-height:1.35;padding:1px 7px 2px;border-radius:999px;background:#fdf8ea;color:var(--ink);box-shadow:0 1px 0 rgba(95,58,32,.3)}
.char .tag b{font-family:var(--font-display);font-weight:400;color:var(--leaf);margin-right:3px}
.char .bubble{position:relative;max-width:150px;width:max-content;padding:4px 9px;border-radius:11px;background:#fff;color:var(--ink);font-size:11.5px;line-height:1.35;box-shadow:0 2px 6px rgba(30,50,40,.2);word-break:keep-all;overflow-wrap:anywhere;animation:pop .25s ease-out}
.char .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.char.me .tag{background:var(--pop);color:#fff}
.char.me .tag b{color:#fff}
.char.me::before{content:"";position:absolute;left:50%;bottom:-3px;width:46px;height:14px;margin-left:-23px;border:3px solid var(--pop);border-radius:50%;opacity:.85;animation:ring 1.6s ease-in-out infinite}
.char.focus .body{animation:hop .45s ease-out 4}
.legL,.legR{transform-box:fill-box;transform-origin:50% 0}
.char.walking .legL{animation:step .42s ease-in-out infinite alternate}
.char.walking .legR{animation:step .42s ease-in-out infinite alternate-reverse}
.char.walking .bob{animation:bob .21s ease-in-out infinite alternate}
.char:not(.walking) .bob{animation:breathe 2.6s ease-in-out infinite}
@keyframes step{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
@keyframes bob{to{transform:translateY(-2.5px)}}
@keyframes breathe{50%{transform:translateY(-1px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes ring{50%{transform:scale(1.15);opacity:.45}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ping{position:absolute;width:30px;height:12px;margin:-6px 0 0 -15px;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ping .7s ease-out forwards}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.sparkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}

/* ---------- HUD ---------- */
.hud-top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud-top>*{pointer-events:auto}
.logo{width:220px;filter:drop-shadow(0 6px 8px rgba(40,30,10,.32))}
.logo-svg{display:block;width:100%;height:auto;overflow:visible}
.hud-right{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:none}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--paper);border:0;box-shadow:var(--lift);white-space:nowrap}
.pill svg{flex:none}
.pill b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--leaf);font-variant-numeric:tabular-nums}
.pill .long{display:inline}
.pill .short{display:none}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:var(--lift);display:grid;place-items:center;color:var(--ink)}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pop);color:#fff;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.menu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);z-index:45;width:250px;padding:8px;border-radius:18px;background:var(--paper);box-shadow:var(--lift);display:flex;flex-direction:column;gap:2px}
.menu button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;gap:8px}
.menu button:hover{background:var(--paper-2)}
.menu .note{font-size:12px;color:var(--ink-soft);padding:8px 12px 4px;line-height:1.5}
.menu .danger{color:#b4442c}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;gap:10px;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.hud-bottom>*{pointer-events:auto}
.talk{flex:1;min-width:0;max-width:520px;display:flex;flex-direction:column;gap:8px}
.emotes{display:flex;gap:6px;flex-wrap:wrap}
.emotes button{height:36px;padding:0 13px;border-radius:999px;border:0;background:var(--paper);box-shadow:var(--lift);font-size:14px}
.saybar{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--paper);box-shadow:var(--lift)}
.saybar input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;outline:none;font-size:15px}
.saybar button,.btn{border:0;border-radius:999px;height:40px;padding:0 18px;background:var(--leaf);color:#fff;font-family:var(--font-display);font-size:16px;white-space:nowrap}
.mapctl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.zoom{display:flex;flex-direction:column;gap:6px}
#mini{width:144px;height:108px;border-radius:16px;border:3px solid var(--paper);box-shadow:var(--lift);display:block;cursor:pointer;background:var(--water)}
.stage-qr{display:none}

/* ---------- toasts ---------- */
#toasts{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(92vw,460px)}
.toast{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--paper);box-shadow:var(--lift);animation:toastIn .35s ease-out;max-width:100%}
.toast .mini-av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--mint);overflow:hidden}
.toast .mini-av img{width:100%;height:100%;object-fit:cover}
.toast b{font-family:var(--font-display);font-weight:400;color:var(--leaf)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

/* ---------- sheet / panel ---------- */
.scrim{position:absolute;inset:0;z-index:28;background:rgba(28,52,46,.28)}
.sheet{position:absolute;left:50%;bottom:0;z-index:30;width:min(100%,440px);transform:translateX(-50%);background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(30,40,20,.25);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));animation:up .3s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
.card-head{display:flex;gap:16px;align-items:center}
.card-av{width:96px;height:120px;flex:none;border-radius:20px;background:linear-gradient(180deg,var(--mint),#e9f7d9);display:grid;place-items:center}
.card-av img{width:96px;height:120px}
.card-gen{font-family:var(--font-display);font-size:18px;color:var(--leaf)}
.card-name{font-family:var(--font-display);font-size:32px;line-height:1.1}
.tagchip{display:inline-block;margin-top:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.card-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn.pop{background:var(--pop)}
.field{display:flex;gap:6px;padding:5px;border-radius:999px;background:#fff;border:2px solid var(--paper-line)}
.field input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:0 12px;font-size:15px}
.hint{font-size:13px;color:var(--ink-soft);line-height:1.5}

.panel{position:absolute;top:0;right:0;bottom:0;z-index:40;width:min(100%,460px);background:var(--paper);box-shadow:-10px 0 30px rgba(30,40,20,.25);display:flex;flex-direction:column;animation:slide .3s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.panel-head{position:relative;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:2px dashed var(--paper-line)}
.panel-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.02em}
.panel-head p{margin:4px 0 0;color:var(--ink-soft)}
.panel-head .close{top:calc(env(safe-area-inset-top,0px) + 16px)}
.panel-body{flex:1;overflow:auto;touch-action:pan-y;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 20px}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px dotted var(--paper-line);display:flex;flex-direction:column;gap:16px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid var(--paper)}
.tl li.now::before{background:var(--pop)}
.tl .yr{font-family:var(--font-display);font-size:26px;color:var(--leaf);font-variant-numeric:tabular-nums}
.tl h3{margin:2px 0 4px;font-size:17px}
.tl p{margin:0;line-height:1.6;color:var(--ink-soft)}
.ex{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);margin-left:6px;vertical-align:2px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.polaroid{background:#fff;padding:8px 8px 10px;border-radius:4px;box-shadow:0 3px 10px rgba(40,30,10,.18);transform:rotate(var(--r,0deg))}
.polaroid .ph{aspect-ratio:1;max-width:100%;border-radius:2px;display:grid;place-items:center;color:rgba(34,69,62,.55);font-size:13px;background:var(--bgc,#e8f1df);overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid figcaption{font-size:13px;text-align:center;margin-top:7px;color:var(--ink-soft)}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;padding:12px;border:2px dashed var(--paper-line);border-radius:14px;cursor:pointer;color:var(--ink-soft)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}

/* people */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--paper-line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.person{border:0;background:#fff;border-radius:16px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--paper-line)}
.person img{width:60px;height:60px}
.person .g{font-family:var(--font-display);color:var(--leaf);font-size:14px}
.person .n{font-size:14px}
.person.me{outline:3px solid var(--pop)}
.search{margin-bottom:12px}

/* bridge */
.bridge-hero{border-radius:20px;padding:22px;background:linear-gradient(160deg,#3f8f87,#2e6f69);color:var(--paper)}
.bridge-hero h3{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:26px}
.bridge-hero p{margin:0;line-height:1.6;opacity:.92}
.feature-list{margin:16px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.feature-list li{padding:12px 14px;border-radius:14px;background:#fff;line-height:1.5}

/* inbox */
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--paper-line)}
.msg .mini-av{width:46px;height:46px;border-radius:50%;background:var(--mint);flex:none;overflow:hidden}
.msg .mini-av img{width:100%;height:100%;object-fit:cover}
.msg .who{font-family:var(--font-display);color:var(--leaf)}
.msg p{margin:2px 0 6px;line-height:1.5}
.msg time{font-size:12px;color:var(--ink-soft)}
.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);line-height:1.6}

/* editor */
.ed-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.ed-tabs button{flex:1;border:0;border-radius:12px;padding:9px 10px;background:var(--paper-2);font-family:var(--font-display);font-size:16px;white-space:nowrap}
.ed-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.ed-group{margin-bottom:14px}
.ed-group h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--ink-soft);font-weight:400}
.ed-opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{width:64px;height:64px;padding:0;border-radius:14px;border:3px solid transparent;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--paper-line)}
.opt img.head{width:60px;height:60px}
.opt img.body,.opt img.chest{width:56px;height:48px}
.opt[aria-pressed="true"]{border-color:var(--pop)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--paper-line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pop)}
.toggle{border:2px solid var(--paper-line);background:#fff;border-radius:999px;padding:7px 16px}
.toggle[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:#fff}

/* ---------- entry ---------- */
.entry{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,64,56,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));overflow:auto;touch-action:pan-y}
.entry-card{position:relative;width:min(100%,440px);background:var(--paper);border:4px solid var(--wood);border-radius:28px;box-shadow:0 6px 0 var(--wood-dk),0 24px 50px rgba(20,30,20,.35);padding:26px 22px 22px;animation:pop .35s ease-out}
.entry-card h1,.entry-card h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
.entry-logo{width:min(300px,88%);margin:-4px auto 0;filter:drop-shadow(0 5px 6px rgba(40,30,10,.25))}
.lede{text-align:center;font-size:17px;line-height:1.6;margin:18px 0 20px}
.big{width:100%;height:54px;font-size:20px}
.linkish{display:block;margin:12px auto 0;border:0;background:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.step-label{font-size:12px;letter-spacing:.14em;color:var(--wood);margin-bottom:6px}
.entry-card h2{font-size:28px;margin-bottom:14px}
.gen-group{margin-bottom:10px}
.gen-group .lab{font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.gen-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gen-chips button{height:38px;border:2px solid var(--paper-line);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.gen-chips button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.gen-chips .wide{grid-column:span 2}
.ent-field{margin:16px 0 14px}
.ent-field label{display:block;font-size:12px;letter-spacing:.14em;color:var(--wood);margin-bottom:6px}
.ent-field input{width:100%;box-sizing:border-box;height:48px;border:2px solid var(--paper-line);border-radius:14px;padding:0 14px;font-size:17px;background:#fff;outline:none}
.ent-field input:focus{border-color:var(--leaf)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:42px;border:2px solid var(--paper-line);border-radius:12px;background:#fff}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.nav{display:flex;gap:8px;margin-top:18px}
.nav .btn{height:50px;font-size:18px}
.nav .grow{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stagebox{position:relative;margin:4px auto 6px;width:180px;height:210px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#fff 0,var(--mint) 70%);display:grid;place-items:center}
.stagebox img{width:144px;height:180px}
.stagebox .nametag{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--pop);color:#fff}
.make-status{text-align:center;font-family:var(--font-display);font-size:20px;margin:6px 0 12px;color:var(--leaf)}
.make-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.make-actions .btn{height:48px;font-size:17px}
.make-actions .btn.custom{background:var(--paper);color:var(--leaf);border:2.5px solid var(--leaf)}
.make-hint{margin:0 0 10px;text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.5}
.editor-wrap{margin-top:14px;padding-top:14px;border-top:2px dashed var(--paper-line)}

/* ---------- stage (big screen) mode ---------- */
.stage .talk,.stage .zoom{display:none}
.stage #world{--stagebump:1.35}
.stage .char .ui{transform:translateX(-50%) scale(calc(var(--inv) * 1.35))}
.stage .pill{height:56px;font-size:19px;padding:0 22px}
.stage .pill b{font-size:26px}
.stage .stage-qr{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:20px;background:var(--paper);box-shadow:var(--lift);max-width:360px}
.stage-qr .qr{width:86px;height:86px;flex:none;border-radius:12px;border:3px dashed var(--paper-line);display:grid;place-items:center;font-size:12px;color:var(--ink-soft);text-align:center}
.stage-qr b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px}
.stage-qr span{font-size:13px;color:var(--ink-soft);line-height:1.5}
.stage .toast{font-size:20px;padding:10px 24px 10px 10px}
.stage .toast .mini-av{width:48px;height:48px}


/* village board */
.panel.wide{width:min(100%,640px)}
.thanks{position:relative;margin:18px 0 26px;padding:30px 18px 14px;border-radius:18px;background:linear-gradient(180deg,#fff9e3,#fdf0c6);border:3px solid #e8c56a;box-shadow:0 3px 0 #d9ae49}
.ty-ribbon{position:absolute;top:-15px;left:50%;transform:translateX(-50%);padding:5px 20px 6px;border-radius:999px;background:#d39b2c;color:#fff;font-family:var(--font-display);letter-spacing:.2em;font-size:15px;white-space:nowrap;box-shadow:0 2px 0 #a8740f}
.thanks h3{margin:0 0 14px;text-align:center;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.3;text-wrap:balance}
.ty-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ty-col{min-width:0}
.ty-col h4{margin:0 0 8px;padding-bottom:6px;font-size:13px;letter-spacing:.04em;color:#9a6d12;font-weight:400;border-bottom:1px dashed #e2c47c;display:flex;justify-content:space-between}
.ty-col h4 em{font-style:normal;color:#b8913a}
.ty-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ty-col li{line-height:1.4;overflow-wrap:anywhere}
.ty-col li span{display:block;font-size:13px;color:var(--ink-soft)}
.ty-empty{margin:0;font-size:13px;color:#a8894a;line-height:1.5}
.thanks .linkish{margin-top:14px}
.ty-form{margin-top:10px;padding-top:12px;border-top:1px dashed #e2c47c;display:flex;flex-direction:column;gap:8px}
.ty-form input{width:100%;box-sizing:border-box;min-width:0;height:42px;border:2px solid var(--paper-line);border-radius:12px;padding:0 12px;background:#fff;font-size:15px;outline:none}
.ty-form input:focus{border-color:var(--leaf)}
.ty-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.ty-del{display:flex;flex-wrap:wrap;gap:6px}
.bd-h{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:21px}
.bd-h span{font-size:14px;color:var(--ink-soft)}
.bd-write{background:var(--note);border-radius:6px;padding:12px;box-shadow:0 3px 8px rgba(60,40,10,.15);margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.bd-write.empty{background:var(--paper-2);align-items:center;text-align:center;color:var(--ink-soft);padding:18px}
.bd-who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.mini-av img{width:100%;height:100%;object-fit:cover;display:block}
.bd-who .mini-av,.note .mini-av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.65);overflow:hidden;flex:none}
.bd-write textarea{border:0;background:rgba(255,255,255,.6);border-radius:6px;padding:10px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;min-height:72px;outline:none;color:var(--ink)}
.bd-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bd-colors{display:flex;gap:6px}
.bd-colors .sw{width:28px;height:28px}
.cork{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 14px;padding:22px 14px 18px;border-radius:14px;background:#cf9d62 radial-gradient(rgba(120,70,20,.2) 1px,transparent 1.6px) 0 0/9px 9px;border:8px solid #9a6438;box-shadow:inset 0 2px 8px rgba(60,30,0,.3)}
.note{position:relative;min-width:0;background:var(--note);padding:18px 12px 10px;transform:rotate(var(--r));box-shadow:0 4px 8px rgba(60,30,0,.25);display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.note .pin{position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8a,#d9463a);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.note p{margin:0;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.note footer{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 8px;margin-top:auto}
.note .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px}
.note .by{display:flex;flex-direction:column;min-width:0;font-size:12px;line-height:1.3}
.note .by b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .by time{color:var(--ink-soft);font-size:11px}
.note .like,.note .del{border:0;background:rgba(255,255,255,.65);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--ink-soft)}
.note .like.on{color:#d9463a}
.bd-empty{grid-column:1/-1;text-align:center;color:#fff8e6;padding:30px 10px;line-height:1.6;font-size:15px;text-shadow:0 1px 1px rgba(80,40,0,.4)}
@media (max-width:480px){.ty-cols{grid-template-columns:1fr}.ty-row{grid-template-columns:96px minmax(0,1fr)}.cork{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media (max-width:560px){
  .logo{width:148px}
  .hud-right{gap:6px}
  .iconbtn{width:40px;height:40px}
  .pill{height:40px}
  .pill{padding:0 12px}
  .pill .long{display:none}
  .pill .short{display:inline}
  #mini{width:104px;height:78px;border-radius:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(() => {
'use strict';
/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const CLOSE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const CONFIG = { bridgeUrl: '' };  // BIT Bridge 주소를 받으면 여기에 넣어요
function shade(hex, p){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255; const t=p<0?0:255, f=Math.abs(p)/100; r=Math.round((t-r)*f+r); g=Math.round((t-g)*f+g); b=Math.round((t-b)*f+b); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function isLight(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255)) > 170; }
const genLabel = g => g === 'G' ? '게스트' : g + '기';

/* ================= avatar parts ================= */
const AV = {

  hairColor:['#2a211f','#4f3424','#7f5233','#b98a52','#e6cf98','#8c3f33','#475a80','#d985a8'],

  eyes:['dot','round','smile','sleepy','wink'],
  mouth:['smile','open','cat','small','grin'],
  top:['tee','long','sweater','bit'],
  topColor:['#5b9fd6','#ef8a6b','#76bf86','#f3c653','#ad88d6','#fbfbf7','#3c4a5e','#de5b6c'],
  bottom:['pants','shorts','skirt'],
  bottomColor:['#3a4a6c','#2d2d34','#5a7f9e','#a24f5c','#6b7d4f','#7a5a8c'],
  shoe:['#4a3a32','#f4f1ea','#2d2d34','#c0573f'],
  acc:['none','glasses','round','cap','beanie','flower','headphones','ribbon','tie'],
  accColor:['#e05a6b','#5b9fd6','#f3c653','#3c4a5e','#76bf86','#ad88d6']
};
const LABEL = {short:'짧은 머리',side:'옆가르마',buzz:'까까머리',curly:'곱슬',mop:'덥수룩 앞머리',bob:'단발',long:'긴 머리',pony:'포니테일',bun:'똥머리',
  dot:'콩눈',round:'반짝눈',smile:'웃는 눈',sleepy:'졸린 눈',wink:'윙크',open:'활짝',cat:'고양이 입',small:'오',grin:'이 보이게',
  tee:'반팔',long:'긴팔',hoodie:'후드',shirt:'셔츠',stripe:'줄무늬',bit:'BIT 티',sweater:'스웨터',pants:'긴 바지',shorts:'반바지',skirt:'치마',
  none:'없음',glasses:'안경',cap:'모자',beanie:'비니',flower:'꽃핀',headphones:'헤드폰',ribbon:'리본',tie:'넥타이'};
LABEL.smileM = '미소';

function randomAvatar(g, rnd = Math.random){
  const p = arr => arr[Math.floor(rnd()*arr.length)];
  const gender = (g === 'm' || g === 'f') ? g : (rnd() < .5 ? 'm' : 'f');
  return {
    g: gender,
    skin: p(AV.skin), hairColor: rnd() < .55 ? p(AV.hairColor.slice(0,3)) : p(AV.hairColor),
    hair: p(gender === 'm' ? AV.hairM : AV.hairF),
    eyes: p(AV.eyes), mouth: p(AV.mouth), blush: rnd() < .55,
    top: p(AV.top), topColor: p(AV.topColor),
    bottom: gender === 'm' ? (rnd() < .75 ? 'pants' : 'shorts') : p(['pants','skirt','skirt','shorts']),
    bottomColor: p(AV.bottomColor), shoe: p(AV.shoe),
    acc: rnd() < .42 ? 'none' : p(AV.acc.slice(1)), accColor: p(AV.accColor)
  };
}

/* ================= 3D avatar engine ================= */
// Characters are assembled from rounded 3D parts and lit like a toy figure, then rendered once into
// a small sprite sheet (front / left / right × stand / step / step + blink) that the plaza plays back.
const R3 = { ok: false, failed: false, tex: {} };
const GEO = {};
const HEAD = { y: 2.12, sx: 0.98, sy: 0.93, sz: 0.9 };
const FW = 112, FH = 140;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function initR3(){
  if (R3.ok || R3.failed) return R3.ok;
  try {
    if (!window.THREE) throw new Error('no three');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = .92;
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xfff6ea, 0x7d9a6c, 0.62));

  const v = VIEWS[name], c = R3.cam, d = Math.hypot(11.5, v.cy - v.y);
  R3.renderer.setSize(w, h, false);
  c.aspect = w / h; c.position.set(0, v.cy, 11.5); c.lookAt(0, v.y, 0);
  c.fov = 2 * Math.atan(v.h / 2 / d) * 180 / Math.PI; c.updateProjectionMatrix();
}
function renderRig(rig){ R3.scene.add(rig.root); R3.renderer.render(R3.scene, R3.cam); R3.scene.remove(rig.root); }
function disposeRig(rig){ rig.own.forEach(m => m.dispose()); }

// fallback when WebGL is unavailable: a plain soft figure
function drawFallback(ctx, a, x0, w, h){
  ctx.save(); ctx.translate(x0, 0);
  ctx.fillStyle = a.topColor; ctx.beginPath(); ctx.ellipse(w / 2, h * .72, w * .2, h * .15, 0, 0, 7); ctx.fill();
  ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(w / 2, h * .42, w * .27, 0, 7); ctx.fill();
  ctx.fillStyle = a.hairColor; ctx.beginPath(); ctx.arc(w / 2, h * .38, w * .28, Math.PI, 0); ctx.fill();
  ctx.restore();
}

const SIZES = { full: [280, 350], head: [160, 160], body: [140, 120], chest: [140, 120] };
const urlCache = new Map();
function avatarURL(av, crop = 'full'){
  const key = crop + JSON.stringify(av);
  if (urlCache.has(key)) return urlCache.get(key);
  const [w, h] = SIZES[crop];
  let url;
  if (initR3()){
    const rig = buildAvatar(av); poseAvatar(rig, 0, 0, false);
    setView(crop, w, h); renderRig(rig); url = R3.renderer.domElement.toDataURL(); disposeRig(rig);
  } else {
    const c = document.createElement('canvas'); c.width = w; c.height = h; drawFallback(c.getContext('2d'), av, 0, w, h); url = c.toDataURL();
  }
  if (urlCache.size > 400) urlCache.clear();
  urlCache.set(key, url);
  return url;
}
const HEAD_VB = 'head';
function avatarSVG(a, opt = {}){
  const crop = opt.viewBox === HEAD_VB ? 'head' : opt.viewBox === 'chest' ? 'chest' : opt.viewBox ? 'body' : 'full';
  return `<img class="av3 ${crop}" src="${avatarURL(a, crop)}" alt="" draggable="false">`;
}

// sprite sheets for the plaza: index = (look+1)*3 + step, 9 = front blink
const renderQueue = [];
function queueSheet(o, first){ if (first) renderQueue.unshift(o); else renderQueue.push(o); }
function buildSheet(o){
  const sheet = o.sheet || (o.sheet = document.createElement('canvas'));
  sheet.width = FW * 10; sheet.height = FH;
  const sx = sheet.getContext('2d'); sx.clearRect(0, 0, sheet.width, FH);
  if (initR3()){
    const rig = buildAvatar(o.av);
    setView('full', FW, FH);
    let k = 0;
    for (const dir of [-1, 0, 1]) for (const step of [0, 1, 2]){ poseAvatar(rig, step, dir, false); renderRig(rig); sx.drawImage(R3.renderer.domElement, k * FW, 0); k++; }
    poseAvatar(rig, 0, 0, true); renderRig(rig); sx.drawImage(R3.renderer.domElement, 9 * FW, 0);
    disposeRig(rig);
  } else for (let k = 0; k < 10; k++) drawFallback(sx, o.av, k * FW, FW, FH);
  o.fk = -1; o.ready = true; o.el.classList.add('ready'); drawChar(o);
}
function pumpRender(){
  const t0 = performance.now();
  while (renderQueue.length && performance.now() - t0 < 14){
    const o = renderQueue.shift();
    if (chars.get(o.id) === o) buildSheet(o);
  }
}
function drawChar(o){
  if (!o.ready) return;
  let k = (o.look + 1) * 3 + o.step;
  if (k === 3 && o.blinking) k = 9;
  if (k === o.fk) return;
  o.fk = k;
  o.ctx.clearRect(0, 0, FW, FH);
  o.ctx.drawImage(o.sheet, k * FW, 0, FW, FH, 0, 0, FW, FH);
}

  [[G.x-80, G.y-260], [G.x+80, G.y-260]].forEach(([x, y]) => { s += `<rect x="${x-2}" y="${y-70}" width="4" height="78" fill="#5f3a20"/><path d="M${x+2} ${y-66} h30 v52 l-15 -9 l-15 9z" fill="#2f6e68"/><text x="${x+17}" y="${y-43}" text-anchor="middle" font-family="Jua,sans-serif" font-size="12" fill="#fdf8ea">BIT</text><text x="${x+17}" y="${y-30}" text-anchor="middle" font-family="Jua,sans-serif" font-size="10" fill="#c9f2dc">20th</text>`; });

    for (const p of PONDS) if (Math.hypot((x-p.x)/(p.rx+70), (y-p.y)/(p.ry+70)) < 1) return true;
    if (Math.abs(x - G.x) < 170 && y > G.y - 320) return true;
    return false;
  };
  // ----- decorations -----
  const SH = 'rgba(40,70,30,.22)';
  const bush = (x, y, k, fl) => `<ellipse cx="${f(x)}" cy="${f(y+2)}" rx="${f(30*k)}" ry="${f(8*k)}" fill="${SH}"/><circle cx="${f(x-14*k)}" cy="${f(y-11*k)}" r="${f(15*k)}" fill="#4a9449"/><circle cx="${f(x+14*k)}" cy="${f(y-11*k)}" r="${f(15*k)}" fill="#4a9449"/><circle cx="${f(x)}" cy="${f(y-20*k)}" r="${f(17*k)}" fill="#5cab57"/><circle cx="${f(x-5*k)}" cy="${f(y-27*k)}" r="${f(7*k)}" fill="#77c06b"/>` + (fl ? [[-14, -16], [6, -26], [16, -12], [-2, -10]].map(([dx, dy]) => `<circle cx="${f(x+dx*k)}" cy="${f(y+dy*k)}" r="${f(3.4*k)}" fill="${fl}"/>`).join('') : '');
  const rock = (x, y, k) => `<ellipse cx="${f(x)}" cy="${f(y+2)}" rx="${f(20*k)}" ry="${f(6*k)}" fill="${SH}"/><path d="M${f(x-18*k)} ${f(y)} Q${f(x-20*k)} ${f(y-14*k)} ${f(x-5*k)} ${f(y-18*k)} Q${f(x+15*k)} ${f(y-20*k)} ${f(x+18*k)} ${f(y)}Z" fill="#aeb0a8"/><path d="M${f(x-12*k)} ${f(y-10*k)} Q${f(x-6*k)} ${f(y-17*k)} ${f(x+6*k)} ${f(y-16*k)}" stroke="#d6d6cf" stroke-width="${f(3*k)}" fill="none" stroke-linecap="round"/>`;
  const patch = (x, y, c) => { let o = ''; for (let i = 0; i < 7; i++){ const a = rnd() * 6.28, r = rnd() * 16; o += `<circle cx="${f(x + Math.cos(a)*r)}" cy="${f(y + Math.sin(a)*r*.6)}" r="2.6" fill="#5c9e48"/><circle cx="${f(x + Math.cos(a)*r)}" cy="${f(y + Math.sin(a)*r*.6 - 3)}" r="3.6" fill="${c}"/>`; } return o; };
  const mush = (x, y) => `<rect x="${f(x-2)}" y="${f(y-8)}" width="4" height="8" fill="#f4ead6"/><path d="M${f(x-8)} ${f(y-7)} Q${f(x)} ${f(y-18)} ${f(x+8)} ${f(y-7)}Z" fill="#e0533f"/><circle cx="${f(x-2)}" cy="${f(y-11)}" r="1.4" fill="#fff"/><circle cx="${f(x+3)}" cy="${f(y-9)}" r="1.2" fill="#fff"/>`;

  s += `<g transform="translate(1365 1565)"><ellipse cx="0" cy="4" rx="20" ry="6" fill="${SH}"/><rect x="-4" y="-92" width="8" height="96" rx="3" fill="#7d4f2e"/>${[['마을 게시판', -1, -84, '#f2e3c2'], ['BIT BRIDGE', 1, -62, '#d8ecd8'], ['MY CHARACTER', 1, -40, '#f6dccf']].map(([t, d, y, c]) => `<path d="M${d < 0 ? 6 : -6} ${y} h${d*86} l${d*12} 9 l${-d*12} 9 h${-d*86}z" fill="${c}" stroke="#8b5a35" stroke-width="2.5" stroke-linejoin="round"/><text x="${d*46}" y="${y + 13}" text-anchor="middle" font-family="Jua,sans-serif" font-size="11" fill="#5f3a20">${t}</text>`).join('')}</g>`;
  // bushes, flower patches and mushrooms over the lawn
  for (let i = 0, n = 0; i < 900 && n < 70; i++){ const x = rnd()*W, y = rnd()*H; if (blocked(x, y, -55)) continue; n++; s += bush(x, y, .7 + rnd()*.5, rnd() < .45 ? FL[Math.floor(rnd()*5)] : ''); }
  for (let i = 0, n = 0; i < 900 && n < 60; i++){ const x = rnd()*W, y = rnd()*H; if (blocked(x, y, -60)) continue; n++; s += patch(x, y, FL[Math.floor(rnd()*5)]); }
  for (let i = 0, n = 0; i < 400 && n < 14; i++){ const x = rnd()*W, y = rnd()*H; if (blocked(x, y, -40)) continue; n++; s += mush(x, y) + mush(x + 12, y + 4); }

      s += `<circle cx="${f(t.x)}" cy="${f(t.y-44*k)}" r="${f(31*k)}" fill="${c1}"/><circle cx="${f(t.x-15*k)}" cy="${f(t.y-33*k)}" r="${f(20*k)}" fill="${c2}"/><circle cx="${f(t.x+16*k)}" cy="${f(t.y-35*k)}" r="${f(20*k)}" fill="${c2}"/><circle cx="${f(t.x-9*k)}" cy="${f(t.y-57*k)}" r="${f(11*k)}" fill="${c3}"/>`;

  const env = new THREE.CubeTexture([side, side, face('#ffffff', '#ffffff', '#fff3cc'), face('#4a6a35', '#4a6a35', '#3c5a2c'), side, side]);
  env.needsUpdate = true; env.encoding = THREE.sRGBEncoding;
  return (R3.env = env);
}
function statueURL(){

    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  // cast-metal numerals with bevelled edges, standing on a marble plinth with gold trim
  const gold = new THREE.MeshStandardMaterial({ color: lin('#e6b544'), metalness: .62, roughness: .3, envMap: goldEnv(), envMapIntensity: 1.15, emissive: lin('#4d3300'), emissiveIntensity: .2 });
  const marble = new THREE.MeshStandardMaterial({ color: lin('#f4f0e7'), roughness: .42, metalness: 0 });
  const ext = { depth: .2, bevelEnabled: true, bevelThickness: .045, bevelSize: .035, bevelSegments: 5, curveSegments: 32 };
  const two = new THREE.Shape();
  two.moveTo(-.33, 0); two.lineTo(.34, 0); two.lineTo(.34, .17); two.lineTo(.02, .17); two.lineTo(.22, .42);
  two.absarc(0, .68, .32, -.87, 3.05, false);
  two.absarc(0, .68, .15, 3.05, -.72, true);
  two.lineTo(-.33, .17); two.closePath();
  const zero = new THREE.Shape(); zero.absellipse(0, .5, .33, .5, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absellipse(0, .5, .16, .33, 0, Math.PI * 2, true); zero.holes.push(hole);
  const nums = new THREE.Group();
  [[two, -.43], [zero, .42]].forEach(([sh, x]) => { const g = new THREE.ExtrudeGeometry(sh, ext); g.translate(0, 0, -.1); const m = new THREE.Mesh(g, gold); m.position.x = x; nums.add(m); });
  nums.scale.setScalar(1.08); nums.position.y = .27;
  const grp = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(.74, .8, .24, 72), marble); plinth.position.y = .12;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(.68, .74, .05, 72), marble); cap.position.y = .265;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.74, .022, 12, 120), gold); rim.rotation.x = Math.PI / 2; rim.position.y = .24;
  const foot = new THREE.Mesh(new THREE.TorusGeometry(.8, .02, 12, 120), gold); foot.rotation.x = Math.PI / 2; foot.position.y = .02;
  grp.add(plinth, cap, rim, foot, nums); grp.rotation.y = -.22;
  const w = 460, h = 345, c = R3.cam;
  R3.renderer.setSize(w, h, false); c.aspect = w / h; c.position.set(0, 2.9, 5.2); c.lookAt(0, .5, 0); c.fov = 24; c.updateProjectionMatrix();
  R3.scene.add(grp); R3.renderer.render(R3.scene, c); R3.scene.remove(grp);
  const url = R3.renderer.domElement.toDataURL();
  grp.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  gold.dispose(); marble.dispose();
  return url;
}

/* ================= camera ================= */
const vp = $('#viewport'), worldEl = $('#world');
const cam = { x: 0, y: 0, s: 1 };
const vpSize = () => ({ w: vp.clientWidth || innerWidth, h: vp.clientHeight || innerHeight });
const minScale = () => { const { w, h } = vpSize(); return Math.min(w / W, h / H); };
function applyCam(){
  const { w, h } = vpSize();
  cam.s = clamp(cam.s, minScale(), 2.2);
  const mw = W * cam.s, mh = H * cam.s;
  cam.x = mw <= w ? (w - mw) / 2 : clamp(cam.x, w - mw, 0);
  cam.y = mh <= h ? (h - mh) / 2 : clamp(cam.y, h - mh, 0);
  worldEl.style.transform = `translate3d(${cam.x.toFixed(1)}px,${cam.y.toFixed(1)}px,0) scale(${cam.s.toFixed(4)})`;
  worldEl.style.setProperty('--inv', clamp(.86 / cam.s, .52, 2.2).toFixed(3));
}
function centerOn(x, y, s = cam.s, glide = false){
  const { w, h } = vpSize();
  if (glide){ worldEl.classList.add('glide'); clearTimeout(centerOn.t); centerOn.t = setTimeout(() => worldEl.classList.remove('glide'), 750); }
  cam.s = s; cam.x = w/2 - x*s; cam.y = h/2 - y*s; applyCam();
}
function zoomAt(sx, sy, factor){
  const r = vp.getBoundingClientRect();
  const wx = (sx - r.left - cam.x) / cam.s, wy = (sy - r.top - cam.y) / cam.s;
  cam.s = clamp(cam.s * factor, minScale(), 2.2);
  cam.x = sx - r.left - wx * cam.s; cam.y = sy - r.top - wy * cam.s; applyCam();
}
function toWorld(sx, sy){ const r = vp.getBoundingClientRect(); return { x: (sx - r.left - cam.x) / cam.s, y: (sy - r.top - cam.y) / cam.s }; }
function defaultView(glide){
  const { w, h } = vpSize();
  if (app.classList.contains('stage') || (w > 900 && h > 560)) centerOn(W/2, H/2 - 10, minScale() * (app.classList.contains('stage') ? 1 : 1.04), glide);
  else centerOn(PLAZA.x, PLAZA.y + 10, clamp(h / 1500, .5, .9), glide);
}

/* ================= characters ================= */
const app = $('#app'), charsLayer = $('#chars');
const chars = new Map();
let meId = store.get('bitforest.me', null);
let showBots = true;

function plazaPoint(){
  for (let i = 0; i < 30; i++){ const a = Math.random()*Math.PI*2, d = Math.sqrt(Math.random()); const p = { x: PLAZA.x + Math.cos(a)*d*(PLAZA.rx - 60), y: PLAZA.y + Math.sin(a)*d*(PLAZA.ry - 46) }; if (Math.hypot((p.x - FOUNTAIN.x)/1.6, p.y - FOUNTAIN.y) > FOUNTAIN.r * .78) return p; }
  return { x: PLAZA.x + 380, y: PLAZA.y };
}
function randomTarget(){
  if (Math.random() < .8) return plazaPoint();
  const sg = SEGMENTS[Math.floor(Math.random()*SEGMENTS.length)];
  const t = .3 + Math.random()*.6, dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx, dy), j = (Math.random()-.5)*56;
  return { x: sg.a.x + dx*t - dy/L*j, y: sg.a.y + dy*t + dx/L*j };
}
function route(a, b){
  const c = FOUNTAIN, R = c.r + 18, abx = b.x-a.x, aby = b.y-a.y, L2 = abx*abx + aby*aby || 1;
  const t = ((c.x-a.x)*abx + (c.y-a.y)*aby) / L2;
  if (t <= 0 || t >= 1) return [b];
  const px = a.x + abx*t, py = a.y + aby*t, d = Math.hypot(px-c.x, py-c.y);
  if (d >= R) return [b];
  let nx = px - c.x, ny = py - c.y; if (d < 1){ nx = -aby; ny = abx; }
  const n = Math.hypot(nx, ny);
  return [{ x: c.x + nx/n*(R+34), y: c.y + ny/n*(R+34) }, b];
}
function walkTo(o, p){ o.queue = route(o, p); }

function addChar(c, { arrive = false } = {}){
  if (chars.has(c.id)) return chars.get(c.id);
  const o = Object.assign({}, c, { queue: [], wait: Math.random()*3, speed: c.bot ? 36 + Math.random()*26 : 85, walking: false, flip: false, z: -1, holdUntil: 0 });
  if (arrive){ o.x = GATE.x + (Math.random()-.5)*40; o.y = GATE.y + 70; o.queue = [{ x: GATE.x + (Math.random()-.5)*50, y: GATE.y - 300 }, ...route({ x: GATE.x, y: GATE.y - 300 }, plazaPoint())]; }
  else { const p = randomTarget(); o.x = p.x; o.y = p.y; }
  const el = document.createElement('div');
  el.className = 'char' + (c.bot ? ' bot' : '') + (c.id === meId ? ' me' : '');
  el.dataset.id = c.id;
  el.innerHTML = `<div class="ui"><div class="bubble" hidden></div><div class="tag"><b>${esc(genLabel(c.gen))}</b>${esc(c.name)}</div></div><div class="body"><canvas width="112" height="140"></canvas></div>`;
  o.el = el; o.ctx = el.querySelector('canvas').getContext('2d'); o.frames = {}; o.fk = -1; o.step = 0; o.look = 0; o.anim = 0; o.blinking = false; o.blinkT = 1 + Math.random()*4; o.ready = false; queueSheet(o, c.id === meId);
  charsLayer.appendChild(el); chars.set(c.id, o); place(o); updateCount();
  return o;
}
function refreshChar(o){ buildSheet(o); o.el.querySelector('.tag').innerHTML = `<b>${esc(genLabel(o.gen))}</b>${esc(o.name)}`; }
function removeChar(id){ const o = chars.get(id); if (!o) return; o.el.remove(); chars.delete(id); updateCount(); }
function place(o){ o.el.style.transform = `translate3d(${o.x.toFixed(1)}px,${o.y.toFixed(1)}px,0)`; const z = Math.round(o.y); if (z !== o.z){ o.z = z; o.el.style.zIndex = z; } }
function say(id, text){
  const o = chars.get(id); if (!o) return;
  const b = o.el.querySelector('.bubble'); b.textContent = text; b.hidden = false;
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  clearTimeout(o.bt); o.bt = setTimeout(() => { b.hidden = true; }, 5200);
}
function visibleChars(){ return [...chars.values()].filter(o => showBots || !o.bot); }
function updateCount(){ const n = visibleChars().length; $('#count').textContent = n; $('#countS').textContent = n; const ec = $('#entryCount'); if (ec) ec.textContent = n; }

let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const o of chars.values()){
    o.blinkT -= dt;
    if (o.blinkT <= 0){ o.blinking = !o.blinking; o.blinkT = o.blinking ? .13 : 2.4 + Math.random()*4; }
    if (!o.queue.length){
      if (o.walking){ o.walking = false; o.el.classList.remove('walking'); o.idleT = 0; }
      o.idleT = (o.idleT || 0) + dt; o.step = 0; if (o.idleT > 1.2) o.look = 0;
      o.wait -= dt;
      if (o.wait <= 0 && now > o.holdUntil){ walkTo(o, randomTarget()); o.wait = 1.5 + Math.random()*5; }
      drawChar(o); continue;
    }
    const t = o.queue[0], dx = t.x - o.x, dy = t.y - o.y, d = Math.hypot(dx, dy), step = o.speed * dt;
    if (d <= step){ o.x = t.x; o.y = t.y; o.queue.shift(); } else { o.x += dx/d*step; o.y += dy/d*step; }
    if (!o.walking){ o.walking = true; o.el.classList.add('walking'); o.anim = 0; }
    o.anim += dt; o.step = [1, 0, 2, 0][Math.floor(o.anim / .13) % 4];
    o.look = Math.abs(dx) > Math.abs(dy) * .6 ? (dx < 0 ? -1 : 1) : 0;
    place(o); drawChar(o);
  }
  pumpRender();
  requestAnimationFrame(tick);
}

/* ================= demo network (to be swapped for Supabase realtime) ================= */
const bc = ('BroadcastChannel' in window) ? (() => { try { return new BroadcastChannel('bitforest'); } catch(e){ return null; } })() : null;
const Net = {
  post(type, data){ if (Cloud.on){ if (type === 'say' || type === 'move') cloudSend(type, data); return; } try { bc && bc.postMessage({ type, data }); } catch(e){} },
  people(){ return store.get('bitforest.people', []); },
  savePerson(p){
    if (Cloud.on) return Cloud.c.from('players').upsert({ id: p.id, gen: String(p.gen), name: p.name, av: p.av }).then(r => { if (r.error) throw r.error; });
    const list = Net.people().filter(x => x.id !== p.id); list.push({ id: p.id, gen: p.gen, name: p.name, av: p.av }); store.set('bitforest.people', list);
  },
  dropPerson(id){
    if (Cloud.on) return Cloud.c.from('players').delete().eq('id', id).then(() => {});
    store.set('bitforest.people', Net.people().filter(x => x.id !== id));
  }
};
if (bc) bc.onmessage = e => {
  const { type, data } = e.data || {};
  if (type === 'join'){ if (!chars.has(data.id)){ addChar(data, { arrive: true }); arrivalToast(data); } }
  else if (type === 'update'){ const o = chars.get(data.id); if (o){ Object.assign(o, { av: data.av, name: data.name, gen: data.gen }); refreshChar(o); } }
  else if (type === 'leave'){ removeChar(data.id); }
  else if (type === 'say'){ say(data.id, data.text); }
  else if (type === 'move'){ const o = chars.get(data.id); if (o){ walkTo(o, data); o.holdUntil = performance.now() + 25000; } }
  else if (type === 'msg'){ if (data.to === meId) receive(data); }
  else if (type === 'board'){ if (!panel.hidden && panel.classList.contains('wide')) renderBoard(); }
};

const BOT_LINES = ['반가워요!','지금도 BIT! ✨','20주년 축하해요 🎉','분수 앞에서 사진 찍어요','사진관 가보셨어요?','몇 기세요?','와 진짜 오랜만이에요','BIT Bridge 가입했어요?','우리 기수 어디 있어요?','이따 뒤풀이 가시나요?'];
const BOT_REPLIES = ['반가워요! 몇 기세요? 😆','와 오랜만이에요!','이따 분수 앞에서 봬요!','BIT Bridge에서 연락해요 🙌','20주년 축하해요 🎉','저도 사진관 가보려고요!'];
function makeBots(){
  const r = mulberry32(77), out = [];
  out.push({ id:'bot-0', gen:12, name:'김서연', bot:true, av: randomAvatar('f', r) });
  out.push({ id:'bot-1', gen:25, name:'이준호', bot:true, av: randomAvatar('m', r) });
  const used = new Set(['김서연','이준호']);
  for (let i = 2; i < 44; i++){
    let name; do { name = SUR[Math.floor(r()*SUR.length)] + GIVEN[Math.floor(r()*GIVEN.length)]; } while (used.has(name));
    used.add(name);
    const gen = Math.max(0, Math.min(40, Math.round(r()*40)));
    out.push({ id:'bot-' + i, gen, name, bot:true, av: randomAvatar(null, r) });
  }
  return out;
}

/* ================= toasts ================= */
function toast(html, avatar){
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = (avatar ? `<span class="mini-av">${avatarSVG(avatar, { viewBox: HEAD_VB, noShadow: true })}</span>` : '') + `<span>${html}</span>`;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 4200);
}

let inbox = [];
function inboxKey(){ return 'bitforest.inbox.' + meId; }

function sendMessage(to, text){
  const me = chars.get(meId); if (!me) return;
  if (Cloud.on && !to.bot){
    Cloud.c.from('messages').insert({ to_id: to.id, text: text.slice(0, 200) }).then(({ error }) => toast(error ? '메시지를 보내지 못했어요. 잠시 뒤 다시 보내 주세요' : `<b>${esc(to.name)}</b>님께 보냈어요`));
    return;
  }
  const m = { from: meId, fromName: me.name, fromGen: me.gen, fromAv: me.av, to: to.id, text, ts: Date.now() };
  Net.post('msg', m);
  toast(`<b>${esc(to.name)}</b>님께 보냈어요`);
  if (to.bot) setTimeout(() => {
    const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
    say(to.id, reply);
    receive({ from: to.id, fromName: to.name, fromGen: to.gen, fromAv: to.av, to: meId, text: reply, ts: Date.now() });
  }, 1800 + Math.random()*2200);

  store.set(inboxKey(), inbox); renderBadge();

  if (!window.supabase || !window.supabase.createClient) return false;
  try {
    const c = window.supabase.createClient(SB.url, SB.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data, error } = await c.from('players').select('id,gen,name,av').order('created_at').limit(600);
    if (error) throw error;
    if (Cloud.gaveUp) return false;
    const { data: s } = await c.auth.getSession();
    Object.assign(Cloud, { on: true, c, uid: s && s.session ? s.session.user.id : null });
    return data || [];
  } catch (e) { console.warn('[bitforest] shared mode unavailable, using this browser only', e); return false; }
}
async function ensureAuth(){
  if (!Cloud.on) return true;
  if (Cloud.uid) return true;
  const { data, error } = await Cloud.c.auth.signInAnonymously();
  if (error || !data || !data.user){ console.warn('[bitforest] sign-in failed', error); return false; }
  Cloud.uid = data.user.id;
  subscribeInbox();
  return true;
}
function cloudSubscribe(){
  const ch = Cloud.c.channel('plaza', { config: { broadcast: { self: false } } });
  ch.on('broadcast', { event: 'say' }, ({ payload: d }) => { if (d && chars.has(d.id)) say(d.id, String(d.text || '').slice(0, 40)); })
    .on('broadcast', { event: 'move' }, ({ payload: d }) => { const o = d && chars.get(d.id); if (o && isFinite(d.x) && isFinite(d.y) && inIsland(d.x, d.y, .95)){ walkTo(o, { x: +d.x, y: +d.y }); o.holdUntil = performance.now() + 25000; } })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'players' }, ({ new: p }) => { if (p && !chars.has(p.id)){ const c = normP(p); addChar(c, { arrive: true }); arrivalToast(c); } })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'players' }, ({ new: p }) => { const o = p && chars.get(p.id); if (o && p.id !== meId){ Object.assign(o, normP(p)); refreshChar(o); } })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'players' }, ({ old }) => { if (old && old.id && old.id !== meId) removeChar(old.id); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, boardChanged)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'post_likes' }, boardChanged)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'thanks' }, boardChanged)
    .subscribe();
  Cloud.ch = ch;
}
function cloudSend(event, payload){ if (Cloud.ch) Cloud.ch.send({ type: 'broadcast', event, payload }).catch(() => {}); }
async function subscribeInbox(){
  if (!Cloud.on || !Cloud.uid || Cloud.inboxCh) return;
  const toMsg = m => ({ id: m.id, from: m.from_id, fromName: m.from_name || 'BITor', fromGen: m.from_gen === 'G' ? 'G' : (parseInt(m.from_gen, 10) || 0), fromAv: cleanAv(m.from_av), to: m.to_id, text: m.text, ts: Date.parse(m.created_at) || Date.now() });
  Cloud.inboxCh = Cloud.c.channel('inbox-' + Cloud.uid)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'to_id=eq.' + Cloud.uid }, ({ new: m }) => { if (m && !inbox.some(x => x.id === m.id)) receive(toMsg(m)); })
    .subscribe();
  const { data } = await Cloud.c.from('messages').select('id,from_id,to_id,from_gen,from_name,from_av,text,created_at').eq('to_id', Cloud.uid).order('created_at', { ascending: false }).limit(60);
  if (!data) return;
  const read = new Set(store.get('bitforest.inbox.' + Cloud.uid, []).filter(m => m.read).map(m => m.id));
  const fresh = data.map(m => Object.assign(toMsg(m), { read: read.has(m.id) }));
  const ids = new Set(fresh.map(m => m.id));
  inbox = fresh.concat(inbox.filter(m => !ids.has(m.id))).sort((a, b) => b.ts - a.ts).slice(0, 60);
  store.set('bitforest.inbox.' + Cloud.uid, inbox); renderBadge();
}

/* ----- board storage: Supabase when shared, this browser otherwise ----- */
let boardCache = null, boardTimer = 0;
async function boardFetch(){
  const c = Cloud.c;
  const [p, l, t] = await Promise.all([
    c.from('posts').select('id,author,author_gen,author_name,author_av,text,color,created_at').order('created_at', { ascending: false }).limit(300),
    c.from('post_likes').select('post_id,user_id').limit(5000),
    c.from('thanks').select('id,kind,gen,name,what,created_at').order('created_at').limit(500)
  ]);
  if (p.error || l.error || t.error) throw (p.error || l.error || t.error);
  boardCache = {
    posts: p.data.map(x => ({ id: String(x.id), author: x.author, gen: x.author_gen === 'G' ? 'G' : (parseInt(x.author_gen, 10) || 0), name: x.author_name || 'BITor', av: cleanAv(x.author_av), text: x.text, color: x.color, ts: Date.parse(x.created_at), likes: l.data.filter(k => k.post_id === x.id).map(k => k.user_id) })),
    thanks: t.data.map(x => ({ id: String(x.id), kind: x.kind, gen: x.gen, name: x.name, what: x.what, ts: Date.parse(x.created_at) }))
  };
  return boardCache;
}
function boardOpen(){ return !panel.hidden && panel.classList.contains('wide'); }
function boardChanged(){
  clearTimeout(boardTimer);
  boardTimer = setTimeout(async () => { if (!boardOpen()) return; try { await boardFetch(); renderBoard(); } catch (e) {} }, 250);
}
const Board = {
  async post(text, color){
    if (!Cloud.on){ const bb = loadBoard(), me = chars.get(meId); bb.posts.push({ id: uid(), author: meId, gen: me.gen, name: me.name, av: me.av, text, color, ts: Date.now(), likes: [] }); saveBoard(bb); return; }
    const { error } = await Cloud.c.from('posts').insert({ text, color }); if (error) throw error; await boardFetch();
  },
  async like(id){
    if (!Cloud.on){ const bb = loadBoard(), p = bb.posts.find(x => x.id === id); if (!p) return; p.likes = p.likes || []; p.likes = p.likes.includes(meId) ? p.likes.filter(x => x !== meId) : p.likes.concat(meId); saveBoard(bb); return; }
    const p = boardCache && boardCache.posts.find(x => x.id === id); if (!p) return;
    const q = p.likes.includes(meId) ? Cloud.c.from('post_likes').delete().eq('post_id', +id).eq('user_id', meId) : Cloud.c.from('post_likes').insert({ post_id: +id });
    const { error } = await q; if (error) throw error; await boardFetch();
  },
  async remove(id){
    if (!Cloud.on){ const bb = loadBoard(); bb.posts = bb.posts.filter(x => x.id !== id); saveBoard(bb); return; }
    const { error } = await Cloud.c.from('posts').delete().eq('id', +id); if (error) throw error; await boardFetch();
  },
  async addThanks(t, code){
    if (!Cloud.on){ const bb = loadBoard(); bb.thanks.push(Object.assign({ id: uid(), ts: Date.now() }, t)); saveBoard(bb); return; }
    const { error } = await Cloud.c.rpc('add_thanks', { p_code: code, p_kind: t.kind, p_gen: t.gen, p_name: t.name, p_what: t.what }); if (error) throw error; await boardFetch();
  },
  async removeThanks(id, code){
    if (!Cloud.on){ const bb = loadBoard(); bb.thanks = bb.thanks.filter(x => x.id !== id); saveBoard(bb); return; }
    const { error } = await Cloud.c.rpc('delete_thanks', { p_code: code, p_id: +id }); if (error) throw error; await boardFetch();
  }
};

/* ================= avatar editor ================= */
function mountEditor(root, av, onChange){
  let tab = 'face';
  const GROUPS = {
    face: [ { k:'skin', label:'피부', type:'color', vals:AV.skin }, { k:'eyes', label:'눈', type:'part', vals:AV.eyes, head:true }, { k:'mouth', label:'입', type:'part', vals:AV.mouth, head:true }, { k:'blush', label:'볼터치', type:'toggle' } ],
    hair: [ { k:'hair', label:'헤어스타일', type:'part', vals:AV.hairAll, head:true }, { k:'hairColor', label:'머리색', type:'color', vals:AV.hairColor } ],
    wear: [ { k:'top', label:'상의', type:'part', vals:AV.top }, { k:'topColor', label:'상의 색', type:'color', vals:AV.topColor }, { k:'bottom', label:'하의', type:'part', vals:AV.bottom }, { k:'bottomColor', label:'하의 색', type:'color', vals:AV.bottomColor }, { k:'shoe', label:'신발', type:'color', vals:AV.shoe } ],
    acc: [ { k:'acc', label:'소품', type:'part', vals:AV.acc, head:true }, { k:'accColor', label:'소품 색', type:'color', vals:AV.accColor } ]
  };
  const TABS = [['face','얼굴'],['hair','헤어'],['wear','옷'],['acc','소품']];
  function render(){
    let h = `<div class="ed-tabs" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>`;
    GROUPS[tab].forEach(g => {
      h += `<div class="ed-group"><h4>${g.label}</h4><div class="ed-opts">`;
      if (g.type === 'color') h += g.vals.map(v => `<button type="button" class="sw" data-k="${g.k}" data-v="${v}" style="background:${v}" aria-label="${g.label} ${v}" aria-pressed="${av[g.k] === v}"></button>`).join('');
      else if (g.type === 'toggle') h += `<button type="button" class="toggle" data-k="${g.k}" aria-pressed="${!!av[g.k]}">${av[g.k] ? '켜짐' : '꺼짐'}</button>`;
      else h += g.vals.map(v => { const a = Object.assign({}, av, { [g.k]: v }); return `<button type="button" class="opt" data-k="${g.k}" data-v="${v}" title="${LABEL[v] || v}" aria-label="${LABEL[v] || v}" aria-pressed="${av[g.k] === v}">${avatarSVG(a, { viewBox: g.k === 'acc' && v === 'tie' ? 'chest' : g.head ? HEAD_VB : '8 2 104 156', noShadow: true })}</button>`; }).join('');
      h += `</div></div>`;
    });
    root.innerHTML = h;
  }
  root.onclick = e => {
    const t = e.target.closest('[data-tab]'); if (t){ tab = t.dataset.tab; render(); return; }
    const o = e.target.closest('[data-k]'); if (!o) return;
    const k = o.dataset.k; av[k] = k === 'blush' ? !av.blush : o.dataset.v;
    onChange && onChange(av); render();
  };
  render();
  return { render };
}

function renderEntry(step){
  if (step === 'welcome'){
    card.innerHTML = `<div class="entry-logo"><svg class="logo-svg" viewBox="0 0 320 172" role="img" aria-label="모여봐요 뱌티의 숲, BIT 20th Homecoming"><defs><linearGradient id="wd-entry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c08a55"/><stop offset="1" stop-color="#8a5732"/></linearGradient><linearGradient id="mt-entry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effff6"/><stop offset="1" stop-color="#8fdcbc"/></linearGradient></defs><g font-family="Jua, 'Gowun Dodum', sans-serif" text-anchor="middle" stroke-linejoin="round" stroke-linecap="round"><g fill="#4e2f19" stroke="#4e2f19"><text x="146" y="52" font-size="35" stroke-width="30">모여봐요</text><text x="160" y="120" font-size="62" stroke-width="34">뱌티의 숲</text></g><g fill="url(#wd-entry)" stroke="url(#wd-entry)" transform="translate(0 -3)"><text x="146" y="52" font-size="35" stroke-width="23">모여봐요</text><text x="160" y="120" font-size="62" stroke-width="27">뱌티의 숲</text></g><text x="146" y="48" font-size="35" fill="#fdf4dc" stroke="#5f3a20" stroke-width="3" paint-order="stroke">모여봐요</text><text x="160" y="116" font-size="62" fill="url(#mt-entry)" stroke="#2c5b4b" stroke-width="5" paint-order="stroke">뱌티의 숲</text></g><g transform="translate(160 150)"><rect x="-106" y="-15" width="212" height="32" rx="16" fill="#4e2f19"/><rect x="-102" y="-17" width="204" height="28" rx="14" fill="#fdf4dc"/><text y="2" font-family="'Gowun Dodum', sans-serif" font-size="12" letter-spacing="1.4" fill="#7d4f2e" text-anchor="middle" font-weight="700" textLength="176" lengthAdjust="spacingAndGlyphs">BIT 20TH HOMECOMING</text></g><g transform="translate(52 12) rotate(-30)"><path d="M0 0 C10 -18 30 -16 34 -2 C24 8 8 8 0 0Z" fill="#6cbf5c" stroke="#2f6a3a" stroke-width="2.5" stroke-linejoin="round"/><path d="M3 -1 Q17 -5 30 -3" stroke="#2f6a3a" stroke-width="1.6" fill="none"/></g><g transform="translate(62 18) rotate(22)"><path d="M0 0 C7 -12 21 -11 24 -1 C17 6 6 6 0 0Z" fill="#8fd27a" stroke="#2f6a3a" stroke-width="2.2" stroke-linejoin="round"/></g><g transform="translate(284 64) rotate(-10)"><path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z" fill="#fff3b0" class="sparkle"/></g></svg></div>
      <p class="lede">20년, 우리 여기서 다시 만나요.<br>내 캐릭터를 만들면 광장에 바로 나타나요.</p>
      <button class="btn big" type="button" id="goWho">숲에 들어가기</button>
      <p class="hint" style="text-align:center;margin:12px 0 0">지금 <b id="entryCount">${visibleChars().length}</b>명의 BITor가 광장에 있어요</p>
      <button class="linkish" type="button" id="justLook">캐릭터 없이 광장만 구경하기</button>`;
    $('#goWho').onclick = () => renderEntry('who');
    $('#justLook').onclick = () => { closeEntry(); toast('구경 모드예요. 오른쪽 위 메뉴에서 언제든 캐릭터를 만들 수 있어요'); };
  }
  else if (step === 'who'){
    const groups = [[0,9],[10,19],[20,29],[30,40]];
    const genHtml = groups.map(([a, b]) => { let c = ''; for (let i = a; i <= b; i++) c += `<button type="button" data-gen="${i}" aria-pressed="${draft.gen === i}">${i}</button>`; if (b === 40) c += `<button type="button" class="wide" data-gen="G" aria-pressed="${draft.gen === 'G'}">게스트</button>`; return `<div class="gen-group"><div class="lab">${a}–${b}기</div><div class="gen-chips">${c}</div></div>`; }).join('');
    card.innerHTML = `<div class="step-label">1 / 2 · 나는 누구?</div><h2>몇 기 BITor인가요?</h2>${genHtml}
      <div class="ent-field"><label for="nameIn">이름</label><input id="nameIn" maxlength="10" placeholder="예: 김서연" value="${esc(draft.name)}" autocomplete="name"></div>
      <div class="ent-field" style="margin-bottom:0"><label>캐릭터 스타일</label><div class="seg">${[['m','남자'],['f','여자'],['r','랜덤']].map(([k, l]) => `<button type="button" data-style="${k}" aria-pressed="${draft.style === k}">${l}</button>`).join('')}</div></div>
      <div class="nav"><button class="btn ghost" type="button" id="back">이전</button><button class="btn grow" type="button" id="next">내 캐릭터 만들기</button></div>`;
    const sync = () => { $('#next').disabled = !(draft.gen !== null && draft.name.trim()); };
    sync();
    card.onclick = e => {
      const g = e.target.closest('[data-gen]'); if (g){ draft.gen = g.dataset.gen === 'G' ? 'G' : +g.dataset.gen; card.querySelectorAll('[data-gen]').forEach(b => b.setAttribute('aria-pressed', b === g)); sync(); }
      const s = e.target.closest('[data-style]'); if (s){ draft.style = s.dataset.style; card.querySelectorAll('[data-style]').forEach(b => b.setAttribute('aria-pressed', b === s)); }
    };
    $('#nameIn').oninput = e => { draft.name = e.target.value; sync(); };
    $('#back').onclick = () => { card.onclick = null; renderEntry('welcome'); };
    $('#next').onclick = () => { card.onclick = null; draft.av = null; renderEntry('make'); };
  }
  else if (step === 'make'){
    const label = `${genLabel(draft.gen)} ${draft.name.trim()}`;
    card.innerHTML = `<div class="step-label">2 / 2 · 내 캐릭터</div><h2>${esc(draft.name.trim())}님의 캐릭터</h2>
      <div class="stagebox"><span class="nametag">${esc(label)}</span><div id="mkPrev"></div></div>
      <div class="make-status" id="mkStatus">캐릭터 뽑는 중…</div>
      <p class="make-hint">마음에 안 들면 다시 뽑거나, 머리·옷·소품을 직접 골라 보세요</p>
      <div class="make-actions"><button class="btn ghost" type="button" id="reroll">🎲 다시 뽑기</button><button class="btn custom" type="button" id="custom">✏️ 직접 꾸미기</button></div>
      <button class="btn big pop" type="button" id="enter" style="margin-top:8px">이 캐릭터로 입장!</button>
      <button class="linkish" type="button" id="back2">기수·이름 다시 고르기</button>
      <div class="editor-wrap" id="edWrap" hidden></div>`;
    const prev = $('#mkPrev'), status = $('#mkStatus');
    let ed = null;
    const show = () => { prev.innerHTML = avatarSVG(draft.av); };
    const roll = () => {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      ['reroll','custom','enter'].forEach(id => $('#'+id).disabled = true);
      status.textContent = '캐릭터 뽑는 중…';
      let n = 0;
      const spin = setInterval(() => {
        draft.av = Object.assign(draft.av || {}, randomAvatar(draft.style)); show();
        if (++n >= (reduce ? 1 : 14)){ clearInterval(spin); status.textContent = ['짠! 이 친구 어때요?','오늘의 나, 완성!','숲에 딱 어울려요!'][Math.floor(Math.random()*3)]; ['reroll','custom','enter'].forEach(id => $('#'+id).disabled = false); ed && ed.render(); }
      }, 75);
    };
    if (draft.av){ show(); status.textContent = '짠! 이 친구 어때요?'; } else roll();
    $('#reroll').onclick = roll;
    $('#custom').onclick = () => { const w = $('#edWrap'); w.hidden = !w.hidden; if (!ed) ed = mountEditor(w, draft.av, () => show()); $('#custom').textContent = w.hidden ? '✏️ 직접 꾸미기' : '꾸미기 닫기'; if (!w.hidden) setTimeout(() => w.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); };
    $('#back2').onclick = () => renderEntry('who');
    $('#enter').onclick = () => enterForest();
  }
}
async function enterForest(){
  const btn = $('#enter'); if (btn) btn.disabled = true;
  await bootReady;
  const fail = () => { if (btn) btn.disabled = false; toast('입장하지 못했어요. 잠시 뒤 다시 눌러 주세요'); };
  if (Cloud.on && !(await ensureAuth())) return fail();
  const oldId = meId;
  if (oldId){ removeChar(oldId); if (!Cloud.on){ Net.dropPerson(oldId); Net.post('leave', { id: oldId }); } }
  meId = Cloud.on ? Cloud.uid : 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const me = { id: meId, gen: draft.gen, name: draft.name.trim().slice(0, 10), av: Object.assign({}, draft.av) };
  try { await Net.savePerson(me); } catch (e){ console.warn(e); meId = null; return fail(); }
  store.set('bitforest.me', meId);
  if (Cloud.on) subscribeInbox();
  closeEntry();
  const o = addChar(me, { arrive: true });
  o.holdUntil = performance.now() + 12000;
  Net.post('join', me);
  loadInbox(); $('#talk').hidden = false;
  if (!app.classList.contains('stage')){ const { h } = vpSize(); centerOn(GATE.x, GATE.y - 200, clamp(h/1500, .5, .9)); setTimeout(() => centerOn(PLAZA.x, PLAZA.y + 120, cam.s, true), 1800); }
  toast(`숲에 오신 걸 환영해요, <b>${esc(genLabel(me.gen))} ${esc(me.name)}</b>님!`, me.av);
  setTimeout(() => say(meId, '👋 안녕하세요!'), 2600);
}

/* ================= input ================= */
const ptrs = new Map(); let drag = null, pinch = null;
vp.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false, target: e.target };
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, s: cam.s, w: toWorld((a.x+b.x)/2, (a.y+b.y)/2) }; if (drag) drag.moved = true; }
  try { vp.setPointerCapture(e.pointerId); } catch(_){}
});
vp.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], r = vp.getBoundingClientRect();
    cam.s = clamp(pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d, minScale(), 2.2);
    cam.x = (a.x+b.x)/2 - r.left - pinch.w.x*cam.s; cam.y = (a.y+b.y)/2 - r.top - pinch.w.y*cam.s; applyCam(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 7){ drag.moved = true; vp.classList.add('dragging'); }
  if (drag.moved){ cam.x = drag.cx + dx; cam.y = drag.cy + dy; applyCam(); }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1){ const [p] = [...ptrs.values()]; drag = { sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: true, target: null }; return; }
  if (ptrs.size === 0 && drag){ if (!drag.moved && e.type === 'pointerup') handleTap(drag.target, e.clientX, e.clientY); drag = null; vp.classList.remove('dragging'); }
}
vp.addEventListener('pointerup', endPtr); vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, { passive: false });
function handleTap(target, sx, sy){
  if (!target) return;
  const ch = target.closest && target.closest('.char'); if (ch){ openCard(ch.dataset.id); return; }
  const b = target.closest && target.closest('[data-b]'); if (b){ openBuilding(b.dataset.b); return; }
  const me = chars.get(meId);
  if (me && !app.classList.contains('stage')){
    const p = toWorld(sx, sy);
    if (!inIsland(p.x, p.y, .92)) return;
    walkTo(me, p); me.wait = 0; me.holdUntil = performance.now() + 25000;
    Net.post('move', { id: meId, x: p.x, y: p.y });
    const pg = document.createElement('div'); pg.className = 'ping'; pg.style.left = p.x + 'px'; pg.style.top = p.y + 'px'; $('#signs').appendChild(pg); setTimeout(() => pg.remove(), 750);
  }
}
// keyboard access for world signs (pointer taps are handled above)
$('#signs').addEventListener('click', e => { if (e.detail !== 0) return; const b = e.target.closest('[data-b]'); if (b) openBuilding(b.dataset.b); });
$('#zoomIn').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.25); };
$('#zoomOut').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, .8); };
addEventListener('resize', () => applyCam());

$('#sayForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#sayInput'), v = i.value.trim(); if (!v || !meId) return; say(meId, v); Net.post('say', { id: meId, text: v }); i.value = ''; i.blur(); });
document.querySelector('.emotes').addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (!b || !meId) return; say(meId, b.dataset.say); Net.post('say', { id: meId, text: b.dataset.say }); });
$('#countPill').onclick = () => openBuilding('people');
$('#inboxBtn').onclick = () => openInbox();

const menu = $('#menu'), menuBtn = $('#menuBtn');
let resetArmed = false;
menuBtn.onclick = () => { menu.hidden = !menu.hidden; menuBtn.setAttribute('aria-expanded', !menu.hidden); resetArmed = false; $('#resetBtn').textContent = '내 캐릭터 지우고 처음부터'; };
document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !menuBtn.contains(e.target)){ menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); } });
menu.onclick = e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'me'){ menu.hidden = true; openBuilding('closet'); }
  if (act === 'stage'){
    const on = app.classList.toggle('stage'); $('#stageState').textContent = on ? '켜짐' : '꺼짐';
    menu.hidden = true; closeSheet(); closePanel(); defaultView(true);
    if (on) toast('전광판 모드예요. 큰 화면에 띄워 두면 새로 온 BITor가 바로 보여요');
  }
  if (act === 'bots'){ showBots = !showBots; if (showBots) ensureDemo(); app.classList.toggle('hide-bots', !showBots); $('#botState').textContent = showBots ? '켜짐' : '꺼짐'; updateCount(); }
  if (act === 'reset'){
    if (!meId){ menu.hidden = true; openEntry('who'); return; }
    if (!resetArmed){ resetArmed = true; a.textContent = '한 번 더 누르면 지워져요'; return; }
    removeChar(meId); Net.dropPerson(meId); Net.post('leave', { id: meId }); store.del(inboxKey()); store.del('bitforest.me');
    meId = null; inbox = []; renderBadge(); $('#talk').hidden = true; menu.hidden = true;
    Object.assign(draft, { gen: null, name: '', style: 'r', av: null }); openEntry('welcome');
  }
};

/* ================= minimap ================= */
const mini = $('#mini'); let islandPath2D = null;
function drawMini(){
  const w = mini.clientWidth, h = mini.clientHeight; if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  if (mini.width !== Math.round(w*dpr)){ mini.width = Math.round(w*dpr); mini.height = Math.round(h*dpr); }
  const ctx = mini.getContext('2d');
  ctx.setTransform(dpr*w/W, 0, 0, dpr*h/H, 0, 0);
  ctx.fillStyle = '#7fd0e3'; ctx.fillRect(0, 0, W, H);
  if (!islandPath2D && islandD) { try { islandPath2D = new Path2D(islandD); } catch(e){} }
  ctx.fillStyle = '#9fd171'; if (islandPath2D) ctx.fill(islandPath2D);
  ctx.strokeStyle = '#ecdfbf'; ctx.lineWidth = 80; ctx.lineCap = 'round';
  SEGMENTS.forEach(s => { ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke(); });
  ctx.fillStyle = '#ecdfbf'; ctx.beginPath(); ctx.ellipse(PLAZA.x, PLAZA.y, PLAZA.rx, PLAZA.ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7fd0e3'; ctx.beginPath(); ctx.ellipse(FOUNTAIN.x, FOUNTAIN.y, 160, 95, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#f2c24b'; ctx.beginPath(); ctx.arc(FOUNTAIN.x, FOUNTAIN.y - 20, 45, 0, 7); ctx.fill();
  BUILDINGS.forEach(b => { ctx.fillStyle = b.roof; ctx.fillRect(b.x - b.w/2*BS, b.y - b.h/2*BS, b.w*BS, b.h*BS); });
  for (const o of chars.values()){ if (o.bot && !showBots) continue; ctx.fillStyle = o.id === meId ? '#f2785c' : '#22453e'; ctx.beginPath(); ctx.arc(o.x, o.y, o.id === meId ? 26 : 13, 0, 7); ctx.fill(); }
  const { w: vw, h: vh } = vpSize();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 14; ctx.strokeRect(-cam.x/cam.s, -cam.y/cam.s, vw/cam.s, vh/cam.s);
}
mini.addEventListener('click', e => { const r = mini.getBoundingClientRect(); centerOn((e.clientX - r.left)/r.width*W, (e.clientY - r.top)/r.height*H, cam.s, true); });
setInterval(drawMini, 300);

/* ================= boot ================= */
let demoOn = false;
function ensureDemo(){ if (!demoOn){ demoOn = true; startDemo(); } }
function welcomeBack(mine){ addChar(mine); loadInbox(); $('#talk').hidden = false; closeEntry(); setTimeout(() => toast(`다시 오셨네요, <b>${esc(genLabel(mine.gen))} ${esc(mine.name)}</b>님!`, mine.av), 400); }
buildMap();
defaultView(false);
openEntry('welcome');
requestAnimationFrame(tick);
drawMini();
const bootReady = (async () => {
  const people = await Promise.race([cloudStart(), new Promise(r => setTimeout(() => r(false), 7000))]);
  if (!people){
    Cloud.gaveUp = true; Cloud.on = false; ensureDemo();
    Net.people().forEach(p => { if (p.id !== meId) addChar(p); });
    const mine = meId && Net.people().find(p => p.id === meId);
    if (mine) welcomeBack(mine); else { meId = null; store.del('bitforest.me'); }
    return;
  }
  showBots = false; app.classList.add('hide-bots'); $('#botState').textContent = '꺼짐';
  $('#menuNote').textContent = '광장에 보이는 캐릭터는 모두 실제로 입장한 BITor들이에요. 예시 캐릭터를 켜면 분위기를 미리 볼 수 있어요.';
  cloudSubscribe();
  meId = null;
  people.forEach(p => { if (p.id !== Cloud.uid) addChar(normP(p)); });
  const mine = Cloud.uid && people.find(p => p.id === Cloud.uid);
  if (mine){ meId = mine.id; welcomeBack(normP(mine)); subscribeInbox(); }
  updateCount();
})();
})();
</script>
